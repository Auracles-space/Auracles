services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: auracles
      POSTGRES_USER: auracles
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auracles -d auracles"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    # Pinned to a community release: `latest` now resolves to a Pro build that
    # exits without LOCALSTACK_AUTH_TOKEN. 3.x community has free S3.
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      # Ready-hook: auto-create dev buckets + CORS on every startup.
      - ./scripts/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh

  # ClamAV daemon — separate service so its ~1GB signature DB stays off the
  # worker. The worker streams files over TCP (INSTREAM) via CLAMAV_HOST.
  # First boot runs freshclam to fetch signatures (slow — hence start_period).
  clamav:
    # Debian variant: multi-arch (the Alpine-based clamav/clamav:stable has no
    # arm64 build, so it never started on Apple Silicon) and the same base as
    # the ECS worker's clamav/clamav:1.4-debian13-slim.
    image: clamav/clamav-debian:stable
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

  api:
    build: ./backend
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    env_file:
      - ./backend/.env

  beat:
    build: ./backend
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
