[project]
name = "auracles-backend"
version = "0.1.0"
description = "FastAPI backend for the Auracles knowledge marketplace."
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14.0",
  "argon2-cffi>=25.1.0",
  "asyncpg>=0.30.0",
  "boto3>=1.43.24",
  "celery[redis]>=5.4.0",
  "clamd>=1.0.2",
  "cryptography>=48.0.0",
  "datasketch>=1.10.0",
  "email-validator>=2.3.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "langdetect>=1.0.9",
  "loguru>=0.7.2",
  "pdf2image>=1.17.0",
  "pdfplumber>=0.11.9",
  "pillow>=12.2.0",
  "presidio-analyzer>=2.2.362",
  "presidio-anonymizer>=2.2.362",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "pymupdf>=1.26.0",
  "pyotp>=2.9.0",
  "python-jose[cryptography]>=3.5.0",
  "qrcode[pil]>=8.2",
  "redis>=5.2.0",
  "resend>=2.30.1",
  "scikit-learn>=1.9.0",
  "spacy>=3.8.14",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
  "weasyprint>=69.0",
]

[dependency-groups]
dev = [
  "freezegun>=1.5.5",
  "httpx>=0.28.0",
  "mypy>=1.14.0",
  "openapi-spec-validator>=0.9.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "respx>=0.23.1",
  "ruff>=0.8.0",
  "types-qrcode>=8.2.0.20260518",
  "watchdog[watchmedo]>=6.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Inline HTML email templates have long style attributes that cannot be
# wrapped without breaking the markup; line length is not meaningful here.
"app/integrations/resend.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fitz"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
# SQLAlchemy's async engine runs ORM work inside greenlets (greenlet_spawn
# bridges its sync internals to asyncio). Without greenlet concurrency tracking
# coverage.py misses every async service body that awaits the DB, badly
# under-reporting integration-test coverage. Thread is included for the few
# tasks dispatched via asyncio.to_thread in tests.
concurrency = ["greenlet", "thread"]
