[project]
name = "auracles-backend"
version = "0.1.0"
description = "FastAPI backend for the Auracles knowledge marketplace."
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14.0",
  "argon2-cffi>=25.1.0",
  "asyncpg>=0.30.0",
  "celery[redis]>=5.4.0",
  "fastapi>=0.115.0",
  "loguru>=0.7.2",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-jose[cryptography]>=3.5.0",
  "redis>=5.2.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "freezegun>=1.5.5",
  "httpx>=0.28.0",
  "mypy>=1.14.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
