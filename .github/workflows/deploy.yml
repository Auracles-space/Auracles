# CI-gated deploy. Fires Render deploy hooks ONLY after the Checks workflow
# succeeds on main/develop. Render builds the image from backend/Dockerfile
# (no GHCR push needed in Phase 1). Frontend deploys via Vercel's own git
# integration — not handled here.
#
# Phase 2 (AWS): replace the curl hooks with `aws ecs update-service` calls
# (see pre-scale-infra-design.md §5.4).
#
# Required GitHub repo secrets:
#   RENDER_DEPLOY_HOOK_API, RENDER_DEPLOY_HOOK_WORKER, RENDER_DEPLOY_HOOK_BEAT
name: Deploy

on:
  workflow_run:
    workflows: ["Checks"]
    types: [completed]
    branches: [main, develop]

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    # Only deploy when Checks actually passed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy API (runs alembic upgrade head on boot)
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"
      - name: Deploy Celery worker
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}"
      - name: Deploy Celery beat
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BEAT }}"
