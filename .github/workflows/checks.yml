name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auracles
          POSTGRES_USER: auracles
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auracles -d auracles"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://auracles:secret@localhost:5432/auracles
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret
      # Presigned-POST/GET signing is offline (no S3 call), but botocore still
      # needs non-null credentials to build the signature. Dummy values satisfy
      # the signer; no real AWS resource is contacted in the test suite.
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      # WeasyPrint renders invoice and earnings-statement PDFs through Pango,
      # which is a system library rather than a Python dependency. Installed
      # explicitly rather than relying on whatever the runner image ships, and
      # mirrors backend/Dockerfile so CI and the deployed image agree.
      - name: Install PDF rendering system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run openapi-spec-validator ../contracts/openapi.yaml
      # conftest pins the suite at a dedicated `auracles_test` DB so fixtures can
      # truncate freely. The Postgres service only seeds `auracles`, so create the
      # test DB here; the `migrated_database` fixtures run the Alembic upgrade.
      - name: Create test database
        run: PGPASSWORD=secret psql -h localhost -U auracles -d auracles -c "CREATE DATABASE auracles_test OWNER auracles;"
      - run: uv run pytest --cov=app.modules --cov=app.workers --cov-fail-under=80
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade -1
      - run: docker build . --tag auracles-backend:checks

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm generate:api
      - run: git diff --exit-code -- frontend/src/lib/generated
        working-directory: .
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test:coverage
      # NEXT_PUBLIC_* vars are inlined at build time. This CI build only verifies
      # the app compiles and is never deployed, so a dummy publishable key is
      # enough to satisfy the build-time key check. Vercel uses the real key.
      - run: corepack pnpm build
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
