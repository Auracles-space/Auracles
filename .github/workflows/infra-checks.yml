# Terraform hygiene gates, per CLAUDE.md: `terraform fmt` and `terraform
# validate` run in CI on every PR touching infra/.
#
# Validation runs with -backend=false, so this workflow needs no AWS
# credentials and cannot touch state or real infrastructure. It catches the
# class of error that formatting and static validation catch — syntax, bad
# references, unplannable constructs like unknown for_each keys are NOT all
# caught here (that one needs a real plan), which is why plan-before-apply
# remains a human step.
name: Infra checks

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-checks.yml"
  push:
    branches: [main, develop]
    paths:
      - "infra/**"
      - ".github/workflows/infra-checks.yml"

jobs:
  terraform:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          # Floor matches versions.tf: use_lockfile went GA in 1.11.
          terraform_version: "1.16.0"

      - name: terraform fmt (all of infra/)
        run: terraform fmt -check -recursive -diff infra/

      - name: terraform validate (each stack)
        run: |
          # Validate every directory that declares terraform {} settings —
          # stacks appear as they are built (shared, envs/staging,
          # envs/production) and this discovers them rather than listing them.
          set -euo pipefail
          for dir in $(grep -rl --include='*.tf' 'required_version' infra/ | xargs -n1 dirname | sort -u); do
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false > /dev/null
            terraform -chdir="$dir" validate -no-color
          done
