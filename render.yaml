# Render Blueprint — Auracles Phase 1 (pre-scale) PRODUCTION.
#
# Three services share one Dockerfile (backend/Dockerfile) and one secret group.
# Secrets (sync: false) are NOT stored here — set them in the Render dashboard
# Environment Group "auracles-secrets". Non-secret runtime flags are inline.
#
# Staging: duplicate this blueprint on branch `develop` (or use a second Render
# environment) pointed at the Neon `develop` branch + Upstash staging DB.
#
# Deploy is CI-gated: autoDeploy is false, so a commit only ships after the
# Checks workflow passes and deploy.yml fires the service deploy hooks.
#
# Maps to: docs/superpowers/specs/2026-06-07-pre-scale-infra-design.md §3.1, §5.

envVarGroups:
  - name: auracles-secrets
    envVars:
      # --- Core ---
      - key: DATABASE_URL # Neon main branch, postgresql+asyncpg://...?sslmode=require
        sync: false
      - key: REDIS_URL # Upstash rediss://... (app derives broker and cache on DB 0)
        sync: false
      - key: SECRET_KEY # openssl rand -hex 32 — JWT signing
        sync: false
      # --- Encryption keys (Fernet) — prod boot FAILS if placeholder ---
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: PAYOUT_ACCOUNT_ENCRYPTION_KEY
        sync: false
      - key: PARTNER_WEBHOOK_ENCRYPTION_KEY
        sync: false
      # --- Bootstrap admin ---
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # --- AWS S3 ---
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: S3_ARTIFACTS_BUCKET
        sync: false
      - key: S3_AVATARS_BUCKET
        sync: false
      - key: S3_REPORTS_BUCKET
        sync: false
      - key: S3_THUMBNAILS_BUCKET
        sync: false
      # --- Email (Resend) ---
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      # --- Payments (Stripe) ---
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # --- Payments (Paystack — Nigerian corridor) ---
      # No PAYSTACK_WEBHOOK_SECRET: Paystack signs webhook bodies with the
      # secret key itself, so the app falls back to this value. Transfers must
      # be enabled on the Paystack account separately; they draw from the
      # Paystack balance, not a bank account.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # --- Identity verification (Persona KYC) ---
      - key: PERSONA_API_KEY
        sync: false
      - key: PERSONA_WEBHOOK_SECRET
        sync: false
      - key: PERSONA_INQUIRY_TEMPLATE_ID
        sync: false
      # Frontend page Persona redirects back to after the hosted flow.
      - key: PERSONA_REDIRECT_URL
        value: https://auracles.space/settings/kyc
      # --- Search (Brave) ---
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      # --- CORS (prod frontend origin, comma-separated, no '*') ---
      - key: CORS_ALLOWED_ORIGINS
        sync: false

services:
  # FastAPI web service — runs migrations on boot, serves the API.
  - type: web
    name: auracles-api
    runtime: docker
    repo: https://github.com/Auracles-space/Auracles
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    autoDeploy: false
    healthCheckPath: /v1/health
    # No dockerCommand — use the Dockerfile CMD (migrate + serve). Render's
    # dockerCommand parser mangles the quoted `sh -c "...&&..."` form.
    envVars:
      - fromGroup: auracles-secrets
      - key: ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
      - key: TRUST_PROXY_HEADERS # behind Render's proxy → trust X-Forwarded-*
        value: "true"
      - key: COOKIE_SAMESITE
        value: none # cross-site: Vercel frontend ↔ Render API

  # Celery worker — artifact pipeline, notifications, payouts, reputation.
  # Workers do NOT run migrations (API owns schema).
  #
  # Memory: the PII step loads spaCy en_core_web_lg (~hundreds of MB) via
  # Presidio. The engine is cached once per process (see processing/pii.py), and
  # concurrency is held low so the resident model is not multiplied across
  # children. The `standard` plan provides the RAM headroom the lg model needs;
  # `starter` (512MB) OOM-restarts under this workload.
  - type: worker
    name: auracles-worker
    runtime: docker
    repo: https://github.com/Auracles-space/Auracles
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    autoDeploy: false
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - fromGroup: auracles-secrets
      - key: ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
      # Stream uploads to the separate ClamAV service (its ~1GB signature DB
      # must not live on this worker). Host = the private service name below.
      - key: CLAMAV_HOST
        value: auracles-clamav
      - key: CLAMAV_PORT
        value: "3310"

  # ClamAV daemon — private service dedicated to virus scanning. Isolated so its
  # large in-memory signature database does not compete with the worker's spaCy
  # model. The worker reaches it over the Render private network via INSTREAM.
  # `standard` plan: the loaded signature DB needs > 512MB.
  - type: pserv
    name: auracles-clamav
    runtime: image
    image:
      url: docker.io/clamav/clamav:stable
    plan: standard
    autoDeploy: false

  # Celery Beat — scheduled tasks. Render runs a single instance (singleton).
  - type: worker
    name: auracles-beat
    runtime: docker
    repo: https://github.com/Auracles-space/Auracles
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    autoDeploy: false
    dockerCommand: celery -A app.workers.celery_app beat --loglevel=info --scheduler=celery.beat.PersistentScheduler
    envVars:
      - fromGroup: auracles-secrets
      - key: ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
