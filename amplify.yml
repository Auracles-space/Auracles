# AWS Amplify Hosting build spec (monorepo — app lives in frontend/).
#
# Node is pinned to 22: Next.js 15 is broken under Node 24 (edge-runtime
# EvalError on every route). pnpm comes from corepack at the version pinned
# in package.json.
#
# The env | grep line is load-bearing: Amplify console env vars exist only
# at build time for SSR apps. Every server-side runtime var must be written
# into .env.production during the build or it is simply absent when the SSR
# compute runs. NEXT_PUBLIC_* vars are inlined by `next build` and need no
# forwarding.
#
# What each forwarded var costs if omitted, since the failures are silent
# rather than loud:
#   SESSION_HINT_SECRET  middleware cannot verify the session cookie, fails
#                        closed, and every authenticated route redirects to
#                        /login — the app looks broken, not misconfigured.
#   BACKEND_ORIGIN       server-side fetches fall back to the retired Render
#                        origin (next.config.ts), so pages render empty.
#   RESEND_*             the waitlist signup route cannot reach Resend.
# Adding a var the app needs at runtime? Add it to this pattern too.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - corepack enable
            - corepack prepare pnpm@11.5.2 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - env | grep -E '^(SESSION_HINT_SECRET|BACKEND_ORIGIN|RESEND_API_KEY|RESEND_AUDIENCE_ID)=' >> .env.production || true
            - pnpm build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
