openapi: 3.1.0
info:
  title: Auracles API
  description: API for the Auracles knowledge marketplace.
  version: 0.1.0
paths:
  /v1/admin/config:
    get:
      tags:
      - Admin
      summary: List Platform Config
      description: List platform financial configuration for admin review.
      operationId: list_platform_config_v1_admin_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminConfigResponse'
      security:
      - HTTPBearer: []
    patch:
      tags:
      - Admin
      summary: Update Platform Config
      description: Update editable platform configuration. Super-admin only, with
        2FA.
      operationId: update_platform_config_v1_admin_config_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminConfigPatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminConfigResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/admin/analytics/dashboard:
    get:
      tags:
      - Admin
      summary: Get admin dashboard analytics
      description: Return current-state admin analytics aggregates plus frozen daily
        trend rows from snapshot history.
      operationId: get_admin_analytics_dashboard_v1_admin_analytics_dashboard_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsDashboardResponse'
      security:
      - HTTPBearer: []
  /v1/admin/analytics/export:
    get:
      tags:
      - Admin
      summary: Export admin analytics as CSV
      description: Stream frozen snapshot history plus current live totals as one
        flat CSV for bounded admin-selected UTC dates.
      operationId: export_admin_analytics_v1_admin_analytics_export_get
      security:
      - HTTPBearer: []
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
          title: From
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
          title: To
      responses:
        '200':
          description: CSV export stream
          content:
            application/json:
              schema: {}
            text/csv:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/moderation/queue:
    get:
      tags:
      - Admin
      summary: List moderation queue rows
      description: Aggregate current rarity, near-duplicate, and PII review signals
        into one paginated admin moderation queue.
      operationId: list_moderation_queue_v1_admin_moderation_queue_get
      security:
      - HTTPBearer: []
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          pattern: ^(all|rarity_review|near_duplicate_block|pii_review)$
          default: all
          title: Type
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminModerationQueueResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/users/{user_id}/roles:
    patch:
      tags:
      - Admin
      summary: Assign Role
      description: Assign or approve a user role.
      operationId: assign_role_v1_admin_users__user_id__roles_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRoleAssignmentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoleAssignmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/users:
    get:
      tags:
      - Admin
      summary: List users for admin account controls
      description: Return a paginated admin user directory with search and suspension
        status filters for account moderation workflows.
      operationId: list_admin_users_v1_admin_users_get
      security:
      - HTTPBearer: []
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
          title: Query
      - name: status
        in: query
        required: false
        schema:
          type: string
          pattern: ^(all|active|suspended|kyc_pending)$
          default: all
          title: Status
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDirectoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/payouts:
    get:
      tags:
      - Admin
      summary: List payouts for admin financial oversight
      description: Return a paginated, read-only payout directory with status and
        provider filters. Payout-account destination details are never included.
      operationId: list_admin_payouts_v1_admin_payouts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          pattern: ^(all|pending|processing|completed|failed)$
          default: all
          title: Status
      - name: provider
        in: query
        required: false
        schema:
          type: string
          pattern: ^(all|stripe|paystack)$
          default: all
          title: Provider
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPayoutDirectoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/users/{user_id}/suspend:
    post:
      tags:
      - Admin
      summary: Suspend User
      description: Suspend a user account and revoke their active session surface.
      operationId: suspend_user_v1_admin_users__user_id__suspend_post
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserSuspendRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSuspensionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/users/{user_id}/unsuspend:
    post:
      tags:
      - Admin
      summary: Unsuspend User
      description: Restore a previously suspended user account.
      operationId: unsuspend_user_v1_admin_users__user_id__unsuspend_post
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUnsuspendRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSuspensionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/users/{user_id}/kyc:
    patch:
      tags:
      - Admin
      summary: Review Kyc
      description: Manually override a user's identity-verification status.
      operationId: review_kyc_v1_admin_users__user_id__kyc_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminKycReviewRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminKycReviewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/credentials:
    get:
      tags:
      - Admin
      summary: List Credential Review Queue
      description: List credentials awaiting (or filtered by) verification status.
      operationId: list_credential_review_queue_v1_admin_credentials_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - unverified
            - pending
            - verified
            - rejected
            type: string
          - type: 'null'
          default: pending
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCredentialsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/credentials/{credential_id}/verify:
    post:
      tags:
      - Admin
      summary: Verify Credential
      description: Mark a pending Credential verified.
      operationId: verify_credential_v1_admin_credentials__credential_id__verify_post
      security:
      - HTTPBearer: []
      parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Credential Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCredentialResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/credentials/{credential_id}/reject:
    post:
      tags:
      - Admin
      summary: Reject Credential
      description: Reject a pending Credential with a reason.
      operationId: reject_credential_v1_admin_credentials__credential_id__reject_post
      security:
      - HTTPBearer: []
      parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Credential Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCredentialRejectRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCredentialResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/credentials/{credential_id}/evidence:
    get:
      tags:
      - Admin
      summary: Download Credential Evidence
      description: Return a presigned URL for an admin to download credential evidence.
      operationId: download_credential_evidence_v1_admin_credentials__credential_id__evidence_get
      security:
      - HTTPBearer: []
      parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Credential Id
      - name: key
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          title: Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialEvidenceDownloadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/frameworks:
    get:
      tags:
      - Admin
      summary: List published Frameworks for admin delist control
      description: Return published Frameworks with their owning Contributor so an
        admin can find and delist an arbitrary Framework, not only signal-flagged
        ones.
      operationId: list_admin_frameworks_v1_admin_frameworks_get
      security:
      - HTTPBearer: []
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
          title: Query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFrameworkDirectoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/frameworks/suspended:
    get:
      tags:
      - Admin
      summary: List Suspended Frameworks
      description: List Frameworks suspended from the marketplace for reinstatement
        review.
      operationId: list_suspended_frameworks_v1_admin_frameworks_suspended_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSuspendedFrameworksResponse'
      security:
      - HTTPBearer: []
  /v1/admin/frameworks/{framework_id}/suspend:
    post:
      tags:
      - Admin
      summary: Suspend Framework
      description: Suspend a published Framework from marketplace discovery.
      operationId: suspend_framework_v1_admin_frameworks__framework_id__suspend_post
      security:
      - HTTPBearer: []
      parameters:
      - name: framework_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Framework Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminFrameworkSuspendRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFrameworkStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/frameworks/{framework_id}/reinstate:
    post:
      tags:
      - Admin
      summary: Reinstate Framework
      description: Reverse a takedown, returning a suspended Framework to the marketplace.
      operationId: reinstate_framework_v1_admin_frameworks__framework_id__reinstate_post
      security:
      - HTTPBearer: []
      parameters:
      - name: framework_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Framework Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFrameworkStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/frameworks/{framework_id}/rarity-block/override:
    post:
      tags:
      - Admin
      summary: Override Rarity Block
      description: Override a near-duplicate rarity hard block after admin review.
      operationId: override_rarity_block_v1_admin_frameworks__framework_id__rarity_block_override_post
      security:
      - HTTPBearer: []
      parameters:
      - name: framework_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Framework Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRarityBlockOverrideRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFrameworkStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/licenses:
    post:
      tags:
      - Admin
      summary: Grant License
      description: Grant a Framework license to an Operator during Phase 2.
      operationId: grant_license_v1_admin_licenses_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLicenseGrantRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLicenseGrantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/admin/escrows/{escrow_id}/release:
    post:
      tags:
      - Admin
      summary: Release Escrow
      description: Release held escrow funds through an audited admin override.
      operationId: release_escrow_v1_admin_escrows__escrow_id__release_post
      security:
      - HTTPBearer: []
      parameters:
      - name: escrow_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Escrow Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminEscrowOverrideRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEscrowResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/escrows/{escrow_id}/refund:
    post:
      tags:
      - Admin
      summary: Refund Escrow
      description: Refund held escrow funds through an audited admin override.
      operationId: refund_escrow_v1_admin_escrows__escrow_id__refund_post
      security:
      - HTTPBearer: []
      parameters:
      - name: escrow_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Escrow Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminEscrowOverrideRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEscrowResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/reputation/recompute:
    post:
      tags:
      - Admin
      summary: Recompute Reputation Subject
      description: Queue an audited, 2FA-gated recompute for one reputation subject.
      operationId: recompute_reputation_subject_v1_admin_reputation_recompute_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReputationRecomputeRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReputationRecomputeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/admin/projects/disputes:
    get:
      tags:
      - Admin
      summary: List Project disputes for the admin queue
      description: Return Project milestone disputes across all Projects, enriched
        with the milestone budget, held escrow amount, project title, and raising
        party. Defaults to active disputes (open or under_review); pass an explicit
        status to view a single status such as resolved.
      operationId: list_project_disputes_v1_admin_projects_disputes_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - open
            - under_review
            - resolved
            type: string
          - type: 'null'
          description: Filter by an exact dispute status.
          title: Status
        description: Filter by an exact dispute status.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDisputesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/projects/disputes/{dispute_id}/resolve:
    post:
      tags:
      - Admin
      summary: Resolve Project Dispute
      description: Resolve a Project dispute through an audited 2FA-gated admin action.
      operationId: resolve_project_dispute_v1_admin_projects_disputes__dispute_id__resolve_post
      security:
      - HTTPBearer: []
      parameters:
      - name: dispute_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Dispute Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDisputeResolveRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/attestations:
    post:
      tags:
      - Attestation
      summary: Request Attestation
      description: Create an Attestation request; fund now or await owner consent.
      operationId: request_attestation_v1_attestations_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestationRequestCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AttestationFundingResponse'
                - $ref: '#/components/schemas/AttestationConsentPendingResponse'
                title: Response Request Attestation V1 Attestations Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Attestation
      summary: List Attestations
      description: List Attestations visible to the authenticated user by workflow
        role.
      operationId: list_attestations_v1_attestations_get
      security:
      - HTTPBearer: []
      parameters:
      - name: role
        in: query
        required: false
        schema:
          enum:
          - requestor
          - attestor
          type: string
          default: requestor
          title: Role
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/attestations/{attestation_id}/consent:
    post:
      tags:
      - Attestation
      summary: Decide Owner Consent
      description: Approve or decline an operator-initiated attestation as the framework
        owner.
      operationId: decide_owner_consent_v1_attestations__attestation_id__consent_post
      security:
      - HTTPBearer: []
      parameters:
      - name: attestation_id
        in: path
        required: true
        schema:
          type: string
