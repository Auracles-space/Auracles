  /v1/partner/catalog:
    get:
      tags:
      - Partner API
      summary: List Partner Catalog
      description: Return published Framework catalog results for Partner API consumers.
      operationId: list_partner_catalog_v1_partner_catalog_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Q
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - newest
          - top-rated
          - most-purchased
          - price_asc
          - price_desc
          type: string
          default: newest
          title: Sort
      - name: sector
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sector
      - name: industry
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Industry
      - name: function
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Function
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: license_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: License Type
      - name: complexity
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 5
            minimum: 1
          - type: 'null'
          title: Complexity
      - name: org_size
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Org Size
      - name: lifecycle_stage
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Lifecycle Stage
      - name: jurisdiction
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Jurisdiction
      - name: price_min
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Price Min
      - name: price_max
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Price Max
      - name: attestation_status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - pending_acceptance
            - attested
            - conditionally_attested
            - none
            type: string
          - type: 'null'
          title: Attestation Status
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExploreFrameworkListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
