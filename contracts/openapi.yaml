components:
  schemas:
    AccountDeletionBlockedReason:
      description: One reason why GDPR account deletion is currently blocked.
      properties:
        code:
          title: Code
          type: string
        count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Count
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: AccountDeletionBlockedReason
      type: object
    AccountDeletionRequestBody:
      description: 'Request body for starting the GDPR account-deletion cooling-off
        flow.


        Password accounts confirm with their password; passwordless (e.g. Google)

        accounts omit it and rely on the deletion grace period as the safety net.

        TOTP still applies when the account has it enabled.'
      properties:
        password:
          anyOf:
          - format: password
            type: string
            writeOnly: true
          - type: 'null'
          title: Password
        totp_code:
          anyOf:
          - maxLength: 16
            minLength: 6
            type: string
          - type: 'null'
          title: Totp Code
      title: AccountDeletionRequestBody
      type: object
    AccountDeletionStatusResponse:
      description: Latest GDPR account-deletion request state for the current user.
      properties:
        blocked_reasons:
          items:
            $ref: '#/components/schemas/AccountDeletionBlockedReason'
          title: Blocked Reasons
          type: array
        completed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Completed At
        id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Id
        requested_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Requested At
        scheduled_for:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Scheduled For
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      required:
      - id
      - status
      - blocked_reasons
      - scheduled_for
      - requested_at
      - completed_at
      title: AccountDeletionStatusResponse
      type: object
    AddRoleRequest:
      description: Request body for self-adding a non-privileged role.
      properties:
        role:
          enum:
          - contributor
          - operator
          - attestor
          title: Role
          type: string
      required:
      - role
      title: AddRoleRequest
      type: object
    AdminAnalyticsDashboardResponse:
      description: Current-state admin analytics plus frozen historical trend rows.
      properties:
        active_users:
          $ref: '#/components/schemas/AdminAnalyticsWindowCounts'
        attestations_issued:
          $ref: '#/components/schemas/AdminAnalyticsWindowCounts'
        disputes_open:
          $ref: '#/components/schemas/AdminAnalyticsDisputesOpen'
        frameworks_published:
          $ref: '#/components/schemas/AdminAnalyticsPublishedFrameworks'
        gmv:
          $ref: '#/components/schemas/AdminAnalyticsGmvResponse'
        new_registrations:
          $ref: '#/components/schemas/AdminAnalyticsWindowCounts'
        trend:
          items:
            $ref: '#/components/schemas/AdminAnalyticsTrendPoint'
          title: Trend
          type: array
      required:
      - gmv
      - active_users
      - new_registrations
      - frameworks_published
      - attestations_issued
      - disputes_open
      - trend
      title: AdminAnalyticsDashboardResponse
      type: object
    AdminAnalyticsDisputesOpen:
      description: Current open dispute counts split by dispute source.
      properties:
        attestations:
          title: Attestations
          type: integer
        projects:
          title: Projects
          type: integer
        total:
          title: Total
          type: integer
      required:
      - total
      - projects
      - attestations
      title: AdminAnalyticsDisputesOpen
      type: object
    AdminAnalyticsGmvBreakdown:
      description: Money totals for each marketplace revenue source within one window.
      properties:
        attestation_fee:
          title: Attestation Fee
          type: string
        collection_purchase:
          title: Collection Purchase
          type: string
        framework_purchase:
          title: Framework Purchase
          type: string
        project_milestone:
          title: Project Milestone
          type: string
      required:
      - framework_purchase
      - collection_purchase
      - project_milestone
      - attestation_fee
      title: AdminAnalyticsGmvBreakdown
      type: object
    AdminAnalyticsGmvResponse:
      description: GMV totals and by-source breakdowns for the admin dashboard.
      properties:
        last_30_days_by_source:
          $ref: '#/components/schemas/AdminAnalyticsGmvBreakdown'
        last_30_days_total:
          title: Last 30 Days Total
          type: string
        last_7_days_by_source:
          $ref: '#/components/schemas/AdminAnalyticsGmvBreakdown'
        last_7_days_total:
          title: Last 7 Days Total
          type: string
        today_by_source:
          $ref: '#/components/schemas/AdminAnalyticsGmvBreakdown'
        today_total:
          title: Today Total
          type: string
      required:
      - today_total
      - last_7_days_total
      - last_30_days_total
      - today_by_source
      - last_7_days_by_source
      - last_30_days_by_source
      title: AdminAnalyticsGmvResponse
      type: object
    AdminAnalyticsPublishedFrameworks:
      description: Published Framework totals and recent publication counts.
      properties:
        last_24_hours:
          title: Last 24 Hours
          type: integer
        last_30_days:
          title: Last 30 Days
          type: integer
        last_7_days:
          title: Last 7 Days
          type: integer
        total:
          title: Total
          type: integer
      required:
      - total
      - last_24_hours
      - last_7_days
      - last_30_days
      title: AdminAnalyticsPublishedFrameworks
      type: object
    AdminAnalyticsTrendPoint:
      description: One frozen UTC daily analytics row for dashboard trend charts.
      properties:
        active_users:
          title: Active Users
          type: integer
        attestations_issued:
          title: Attestations Issued
          type: integer
        disputes_open:
          title: Disputes Open
          type: integer
        frameworks_published:
          title: Frameworks Published
          type: integer
        gmv_total:
          title: Gmv Total
          type: string
        new_registrations:
          title: New Registrations
          type: integer
        snapshot_date:
          format: date
          title: Snapshot Date
          type: string
      required:
      - snapshot_date
      - gmv_total
      - active_users
      - new_registrations
      - frameworks_published
      - attestations_issued
      - disputes_open
      title: AdminAnalyticsTrendPoint
      type: object
    AdminAnalyticsWindowCounts:
      description: Three standard recency windows used across current-state analytics.
      properties:
        last_24_hours:
          title: Last 24 Hours
          type: integer
        last_30_days:
          title: Last 30 Days
          type: integer
        last_7_days:
          title: Last 7 Days
          type: integer
      required:
      - last_24_hours
      - last_7_days
      - last_30_days
      title: AdminAnalyticsWindowCounts
      type: object
    AdminAttestationAssignRequest:
      description: 'Admin request body for dispatching a needs-admin Attestation to
        an org.


        The admin picks the attestor organization only. The org then accepts the

        offer and staffs its own reviewing member through the normal offer flow.'
      properties:
        attestor_org_id:
          format: uuid
          title: Attestor Org Id
          type: string
        reason:
          maxLength: 4000
          minLength: 5
          title: Reason
          type: string
        totp_code:
          maxLength: 16
          minLength: 6
          title: Totp Code
          type: string
      required:
      - attestor_org_id
      - reason
      - totp_code
      title: AdminAttestationAssignRequest
      type: object
    AdminAttestationDetailResponse:
      description: 'Admin detail for one Attestation: the request plus its offer history.'
      properties:
        attestation:
          $ref: '#/components/schemas/AttestationRequestResponse'
        offers:
          items:
            $ref: '#/components/schemas/AdminAttestationOfferItem'
          title: Offers
          type: array
      required:
      - attestation
      - offers
      title: AdminAttestationDetailResponse
      type: object
    AdminAttestationDisputeResolveRequest:
      description: 'Admin request body for resolving an Attestation dispute.


        Module 5 replaces the old release/refund/split money-split model with a

        three-outcome verdict: reject the dispute (report stands, release escrow),

        uphold with a refund, or uphold requiring the attestor to revise.'
      properties:
        is_complex:
          default: false
          title: Is Complex
          type: boolean
        outcome:
          enum:
          - rejected
          - upheld_refund
          - upheld_revise
          title: Outcome
          type: string
        resolution_notes:
          maxLength: 4000
          minLength: 5
          title: Resolution Notes
          type: string
        totp_code:
          maxLength: 16
          minLength: 6
          title: Totp Code
          type: string
      required:
      - outcome
      - resolution_notes
      - totp_code
      title: AdminAttestationDisputeResolveRequest
      type: object
    AdminAttestationOfferItem:
      description: 'One offer made for an Attestation, with the recipient org''s name.


        Admin oversight only: exposes which org an Attestation was offered to (or

        accepted by) and the offer lifecycle timestamps.'
      properties:
        cohort_index:
          title: Cohort Index
          type: integer
        expires_at:
          format: date-time
          title: Expires At
          type: string
        offered_at:
          format: date-time
          title: Offered At
          type: string
        org_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Org Id
        org_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Org Name
        responded_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Responded At
        status:
          title: Status
          type: string
      required:
      - org_id
      - org_name
      - status
      - cohort_index
      - offered_at
      - expires_at
      - responded_at
      title: AdminAttestationOfferItem
      type: object
    AdminAttestationRefundRequest:
      description: Admin request body for refunding a needs-admin Attestation.
      properties:
        reason:
          maxLength: 4000
          minLength: 5
          title: Reason
          type: string
        totp_code:
          maxLength: 16
          minLength: 6
          title: Totp Code
          type: string
      required:
      - reason
      - totp_code
      title: AdminAttestationRefundRequest
      type: object
    AdminAuditLogItem:
      description: One audit log entry for the admin oversight view.
      properties:
        action:
          title: Action
          type: string
        actor_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Actor Id
        created_at:
          format: date-time
          title: Created At
          type: string
        log_id:
          format: uuid
          title: Log Id
          type: string
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        target_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Target Id
        target_type:
          title: Target Type
          type: string
      required:
      - log_id
      - actor_id
      - action
      - target_type
      - target_id
      - metadata
      - created_at
      title: AdminAuditLogItem
      type: object
    AdminAuditLogsResponse:
      description: Paginated audit log view for admin oversight.
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminAuditLogItem'
          title: Items
          type: array
        page:
          minimum: 1.0
          title: Page
          type: integer
        page_size:
          maximum: 100.0
          minimum: 1.0
          title: Page Size
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      title: AdminAuditLogsResponse
      type: object
    AdminConfigItem:
      description: Single platform configuration value visible to administrators.
      properties:
        editable:
          title: Editable
          type: boolean
        key:
          title: Key
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        updated_by:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Updated By
        value:
          title: Value
          type: string
      required:
      - key
      - value
      - editable
      - updated_at
      - updated_by
      title: AdminConfigItem
      type: object
    AdminConfigPatchRequest:
      description: Request body for audited platform configuration changes.
      properties:
        reason:
          maxLength: 500
          minLength: 1
          title: Reason
          type: string
        totp_code:
          maxLength: 16
          minLength: 6
          title: Totp Code
          type: string
        updates:
          items:
            $ref: '#/components/schemas/AdminConfigUpdateItem'
          maxItems: 10
          minItems: 1
          title: Updates
          type: array
      required:
      - reason
      - totp_code
      - updates
      title: AdminConfigPatchRequest
      type: object
    AdminConfigResponse:
      description: Response body for admin platform configuration reads and writes.
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminConfigItem'
          title: Items
          type: array
      required:
      - items
      title: AdminConfigResponse
      type: object
    AdminConfigUpdateItem:
      description: Single admin platform configuration change request.
      properties:
        key:
          enum:
          - commission_rate
          - min_payout_usd
          - refund_window_hours
          - attestation_fee_framework
          - attestation_fee_contributor
          - attestation_fee_operator
          - attestation_fee_credential
          - attestation_cohort_size
          - attestation_completion_sla_days_framework
          - attestation_completion_sla_days_contributor
          - attestation_completion_sla_days_operator
          - attestation_completion_sla_days_credential
          - attestation_offer_accept_hours
          - attestation_dispute_window_business_days
          - saved_search_alert_cadence_hours
          - consent_version_terms_of_service
          - consent_version_privacy_policy
          - account_deletion_grace_days
          - data_export_expiry_days
          - reputation_weights_framework
          - reputation_weights_contributor
          - reputation_weights_operator
          - reputation_weights_attestor
          - reputation_min_activity_framework
          - reputation_min_activity_contributor
          - reputation_min_activity_operator
          - reputation_prior
          - reputation_prior_strength_k
          - reputation_dispute_penalty
          title: Key
          type: string
        value:
          maxLength: 1000
          minLength: 1
          title: Value
          type: string
      required:
      - key
      - value
      title: AdminConfigUpdateItem
      type: object
    AdminConnectorItem:
      description: 'One external OAuth connection for admin oversight.


        Excludes the encrypted access/refresh tokens entirely — only the connection

        metadata (provider, connected account email, scopes, status) is exposed so

        admins can audit connection health and revocation state.'
      properties:
        connection_id:
          format: uuid
          title: Connection Id
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        provider:
          title: Provider
          type: string
        provider_account_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Account Email
        scopes:
          title: Scopes
          type: string
        status:
          title: Status
          type: string
        token_expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Token Expires At
        updated_at:
          format: date-time
          title: Updated At
          type: string
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - connection_id
      - user_id
      - provider
      - provider_account_email
      - scopes
      - status
      - token_expires_at
      - created_at
      - updated_at
      title: AdminConnectorItem
      type: object
    AdminConnectorsResponse:
      description: Paginated external-connection directory for admin oversight.
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminConnectorItem'
          title: Items
          type: array
        page:
          minimum: 1.0
          title: Page
          type: integer
        page_size:
          maximum: 100.0
          minimum: 1.0
          title: Page Size
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      title: AdminConnectorsResponse
      type: object
    AdminCredentialRejectRequest:
      description: Admin request body for rejecting a pending Credential.
      properties:
        reason:
          maxLength: 4000
          minLength: 1
          title: Reason
          type: string
      required:
      - reason
      title: AdminCredentialRejectRequest
      type: object
    AdminCredentialResponse:
      description: Credential detail for the admin review queue (includes review evidence).
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        credential_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Credential Type
        evidence_file_keys:
          items:
            type: string
          title: Evidence File Keys
          type: array
        expires_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Expires Date
        id:
          format: uuid
          title: Id
          type: string
        issued_date:
          format: date
          title: Issued Date
          type: string
        issuer:
          title: Issuer
          type: string
        issuer_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Issuer Type
        reference_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Reference Number
        rejection_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Rejection Reason
        reviewed_by:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Reviewed By
        submitted_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Submitted At
        title:
          title: Title
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        user_id:
          format: uuid
          title: User Id
          type: string
        verification_status:
          title: Verification Status
          type: string
        verification_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Verification Url
        verified_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Verified At
      required:
      - id
      - user_id
      - title
      - issuer
      - issued_date
      - expires_date
      - credential_type
      - verification_url
      - reference_number
      - issuer_type
      - evidence_file_keys
      - verification_status
      - submitted_at
      - verified_at
      - reviewed_by
      - rejection_reason
      - created_at
      - updated_at
      title: AdminCredentialResponse
      type: object
    AdminCredentialsResponse:
      description: Paginated admin credential review queue.
      properties:
        credentials:
          items:
            $ref: '#/components/schemas/AdminCredentialResponse'
          title: Credentials
          type: array
      required:
      - credentials
      title: AdminCredentialsResponse
      type: object
    AdminDeletionRequestItem:
      description: One account-deletion request for the admin GDPR oversight queue.
      properties:
        blocked_reasons:
          items:
            additionalProperties: true
            type: object
          title: Blocked Reasons
          type: array
        completed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Completed At
        request_id:
          format: uuid
          title: Request Id
          type: string
        requested_at:
          format: date-time
          title: Requested At
          type: string
        scheduled_for:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Scheduled For
        status:
          enum:
          - pending
          - scheduled
          - blocked
          - cancelled
          - completed
          title: Status
          type: string
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - request_id
      - user_id
      - status
      - blocked_reasons
      - scheduled_for
      - requested_at
      - completed_at
      title: AdminDeletionRequestItem
      type: object
    AdminDeletionRequestsResponse:
      description: Paginated account-deletion request queue for admins.
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminDeletionRequestItem'
          title: Items
          type: array
        page:
          minimum: 1.0
          title: Page
          type: integer
        page_size:
          maximum: 100.0
          minimum: 1.0
          title: Page Size
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      title: AdminDeletionRequestsResponse
      type: object
    AdminDisputeResolveRequest:
      description: Request body for resolving a Project dispute.
      properties:
        refund_amount:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,10}|(?=[\d.]{1,13}0*$)\d{0,10}\.\d{0,2}0*$)
            type: string
          - type: 'null'
          title: Refund Amount
        release_amount:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,10}|(?=[\d.]{1,13}0*$)\d{0,10}\.\d{0,2}0*$)
            type: string
          - type: 'null'
          title: Release Amount
        resolution_notes:
          maxLength: 4000
          minLength: 5
          title: Resolution Notes
          type: string
        resolution_type:
          enum:
          - release
          - refund
          - split
          title: Resolution Type
          type: string
        totp_code:
          maxLength: 16
          minLength: 6
          title: Totp Code
          type: string
      required:
      - resolution_type
      - resolution_notes
      - totp_code
      title: AdminDisputeResolveRequest
      type: object
    AdminDisputeResponse:
      description: 'Dispute enriched with the context an Admin needs to resolve it.


        Adds the milestone budget, currently-held escrow amount, project title, and

        the name of the party who raised the dispute so the resolver can choose a

        release/refund/split amount without leaving the queue.'
      properties:
        admin_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Admin Id
        contributor_name:
          title: Contributor Name
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        currency:
          title: Currency
          type: string
        escalated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Escalated At
        escrow_amount:
          anyOf:
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Escrow Amount
        escrow_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Escrow Status
        id:
          format: uuid
          title: Id
          type: string
        milestone_budget:
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Milestone Budget
          type: string
        milestone_id:
          format: uuid
          title: Milestone Id
          type: string
        milestone_name:
          title: Milestone Name
          type: string
        operator_name:
          title: Operator Name
          type: string
        project_id:
          format: uuid
          title: Project Id
          type: string
        project_title:
          title: Project Title
          type: string
        raised_by_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Raised By Name
        raised_by_role:
          title: Raised By Role
          type: string
        raised_by_side:
          anyOf:
          - type: string
          - type: 'null'
          title: Raised By Side
        reason:
          title: Reason
          type: string
        refund_amount:
          anyOf:
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Refund Amount
        release_amount:
          anyOf:
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Release Amount
        resolution_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Resolution Notes
        resolution_type:
