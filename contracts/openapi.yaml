components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - display_name
      - roles
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - contributor
            - operator
            - attestor
    RegisterResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    VerifyEmailRequest:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          minLength: 1
    ResendVerificationRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ForgotPasswordRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required:
      - token
      - new_password
      properties:
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    AttestationRequestCreateRequest:
      type: object
      required:
      - target_type
      - target_id
      - requested_specializations
      - requested_jurisdictions
      properties:
        target_type:
          type: string
          enum:
          - framework
          - contributor
          - operator
          - credential
        target_id:
          type: string
          format: uuid
        requested_specializations:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: string
        requested_jurisdictions:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: string
      description: Request body for creating an escrow-funded Attestation request.
    AttestationFundingResponse:
      type: object
      required:
      - id
      - transaction_id
      - provider
      - client_secret
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
          - stripe
        client_secret:
          type: string
      description: PaymentIntent data needed to fund an Attestation fee escrow.
    AttestationEvidenceUploadCreateRequest:
      type: object
      required:
      - file_name
      - content_type
      - size_bytes
      properties:
        file_name:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          minLength: 1
          maxLength: 255
        size_bytes:
          type: integer
          exclusiveMinimum: 0
      description: Request body for creating an Attestation report evidence upload session.
