components:
  schemas:
    AccountDeletionBlockedReason:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Count
      type: object
      required:
      - code
      - message
      title: AccountDeletionBlockedReason
      description: One reason why GDPR account deletion is currently blocked.
    AccountDeletionRequestBody:
      properties:
        password:
          type: string
          format: password
          title: Password
          writeOnly: true
        totp_code:
          anyOf:
          - type: string
            maxLength: 16
            minLength: 6
          - type: 'null'
          title: Totp Code
      type: object
      required:
      - password
      title: AccountDeletionRequestBody
      description: Request body for starting the GDPR account-deletion cooling-off
        flow.
    AccountDeletionStatusResponse:
      properties:
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        blocked_reasons:
          items:
            $ref: '#/components/schemas/AccountDeletionBlockedReason'
          type: array
          title: Blocked Reasons
        scheduled_for:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Scheduled For
        requested_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Requested At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
      type: object
      required:
      - id
      - status
      - blocked_reasons
      - scheduled_for
      - requested_at
      - completed_at
      title: AccountDeletionStatusResponse
      description: Latest GDPR account-deletion request state for the current user.
    AddRoleRequest:
      properties:
        role:
          type: string
          enum:
          - contributor
          - operator
          - attestor
          title: Role
      type: object
      required:
      - role
      title: AddRoleRequest
      description: Request body for self-adding a non-privileged role.
    AdminAnalyticsDashboardResponse:
      properties:
        gmv:
          $ref: '#/components/schemas/AdminAnalyticsGmvResponse'
        active_users:
          $ref: '#/components/schemas/AdminAnalyticsWindowCounts'
        new_registrations:
          $ref: '#/components/schemas/AdminAnalyticsWindowCounts'
        frameworks_published:
          $ref: '#/components/schemas/AdminAnalyticsPublishedFrameworks'
        attestations_issued:
          $ref: '#/components/schemas/AdminAnalyticsWindowCounts'
        disputes_open:
          $ref: '#/components/schemas/AdminAnalyticsDisputesOpen'
        trend:
          items:
            $ref: '#/components/schemas/AdminAnalyticsTrendPoint'
          type: array
          title: Trend
      type: object
      required:
      - gmv
      - active_users
      - new_registrations
      - frameworks_published
      - attestations_issued
      - disputes_open
      - trend
      title: AdminAnalyticsDashboardResponse
      description: Current-state admin analytics plus frozen historical trend rows.
    AdminAnalyticsDisputesOpen:
      properties:
        total:
          type: integer
          title: Total
        projects:
          type: integer
          title: Projects
        attestations:
          type: integer
          title: Attestations
      type: object
      required:
      - total
      - projects
      - attestations
      title: AdminAnalyticsDisputesOpen
      description: Current open dispute counts split by dispute source.
    AdminAnalyticsGmvBreakdown:
      properties:
        framework_purchase:
          type: string
          title: Framework Purchase
        collection_purchase:
          type: string
          title: Collection Purchase
        project_milestone:
          type: string
          title: Project Milestone
        attestation_fee:
          type: string
          title: Attestation Fee
      type: object
      required:
      - framework_purchase
      - collection_purchase
      - project_milestone
      - attestation_fee
      title: AdminAnalyticsGmvBreakdown
      description: Money totals for each marketplace revenue source within one window.
    AdminAnalyticsGmvResponse:
      properties:
        today_total:
