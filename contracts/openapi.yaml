  /v1/explore/frameworks:
    get:
      tags:
      - Explore
      operationId: listExploreFrameworks
      summary: List public Framework catalog
      description: Returns published Frameworks with search, filters, pagination, review aggregates, and any temporary sort shims.
      security:
      - bearerAuth: []
      - {}
      parameters:
      - name: q
        in: query
        schema:
          type:
          - string
          - 'null'
          minLength: 1
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sort
        in: query
        schema:
          $ref: '#/components/schemas/ExploreSort'
      - name: sector
        in: query
        schema:
          anyOf:
          - $ref: '#/components/schemas/FrameworkSector'
          - type: 'null'
      - name: industry
        in: query
        schema:
          anyOf:
          - $ref: '#/components/schemas/FrameworkIndustry'
          - type: 'null'
      - name: function
        in: query
        schema:
          anyOf:
          - $ref: '#/components/schemas/FrameworkFunction'
          - type: 'null'
      - name: category
        in: query
        schema:
          anyOf:
          - $ref: '#/components/schemas/FrameworkCategory'
          - type: 'null'
      - name: license_type
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: complexity
        in: query
        schema:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 5
      - name: org_size
        in: query
        schema:
          anyOf:
          - $ref: '#/components/schemas/OrgSize'
          - type: 'null'
      - name: lifecycle_stage
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: jurisdiction
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: price_min
        in: query
        schema:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
      - name: price_max
        in: query
        schema:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
      - name: attestation_status
        in: query
        schema:
          anyOf:
          - $ref: '#/components/schemas/ExploreAttestationStatus'
          - type: 'null'
      responses:
        '200':
          description: Public Framework catalog returned.
          headers:
            X-Sort-Shim:
              description: true when most-purchased sort uses newest fallback until purchase-count ranking ships.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExploreFrameworkListResponse'
        '422':
          description: Invalid filter or pagination parameters.
