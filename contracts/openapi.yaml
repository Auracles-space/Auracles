openapi: 3.1.0
info:
  title: Auracles API
  version: 0.1.0
  description: API contract for the Auracles knowledge marketplace.
servers:
  - url: http://localhost:8000
    description: Local FastAPI server
tags:
  - name: Health
    description: Platform readiness endpoints.
paths:
  /v1/health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check platform readiness
      description: Reports API, database, and Redis readiness for platform health checks.
      responses:
        "200":
          description: API, database, and Redis are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more required platform components are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    ComponentHealth:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
        detail:
          type:
            - string
            - "null"
    HealthResponse:
      type: object
      required:
        - status
        - components
      properties:
        status:
          type: string
          enum:
            - ok
            - unhealthy
        components:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentHealth"
