          type: string
          format: uuid
        s3_key:
          type: string
        url:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
        size_limit:
          type: integer
        scan_status:
          type: string
          enum:
          - pending_scan
          - clean
          - infected
          - error
      description: Presigned POST response for private Attestation report evidence.
    AttestorApplicationCreateRequest:
