openapi: 3.1.0
info:
  title: Auracles API
  version: 0.1.0
  description: API contract for the Auracles knowledge marketplace.
servers:
  - url: http://localhost:8000
    description: Local FastAPI server
tags:
  - name: Health
    description: Platform readiness endpoints.
  - name: Auth
    description: Registration and identity verification endpoints.
  - name: Admin
    description: Administrative platform endpoints.
paths:
  /v1/auth/register:
    post:
      tags:
        - Auth
      operationId: registerUser
      summary: Register with email and password
      description: Creates a pending user account and sends an email verification token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Generic no-enumeration registration response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "422":
          description: Invalid registration payload.
  /v1/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Login with email and password
      description: Returns a short-lived access token and sets an HttpOnly refresh cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          headers:
            Set-Cookie:
              description: HttpOnly refresh-token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials.
        "403":
          description: Email unverified or account deactivated.
        "429":
          description: Login rate limit exceeded.
        "422":
          description: Invalid login payload.
  /v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      summary: Refresh access token
      description: Rotates the HttpOnly refresh cookie and returns a new access token.
      responses:
        "200":
          description: Refresh succeeded.
          headers:
            Set-Cookie:
              description: Rotated HttpOnly refresh-token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Missing or invalid refresh token.
  /v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Logout current browser session
      description: Revokes the current refresh token and clears its cookie.
      responses:
        "200":
          description: Logout succeeded.
          headers:
            Set-Cookie:
              description: Expired refresh-token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
  /v1/auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: Get authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Account is deactivated.
  /v1/auth/roles:
    post:
      tags:
        - Auth
      operationId: addRole
      summary: Self-add a role
      description: Allows authenticated users to self-add Contributor or Operator roles.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRoleRequest"
      responses:
        "200":
          description: Role assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignmentResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Attestor role requires admin approval.
        "409":
          description: Role already assigned.
        "422":
          description: Invalid role payload.
  /v1/admin/users/{user_id}/roles:
    patch:
      tags:
        - Admin
      operationId: assignUserRole
      summary: Assign or approve a user role
      description: Admin-only endpoint for assigning roles and approving Attestors.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleAssignmentRequest"
      responses:
        "200":
          description: Role assigned or approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoleAssignmentResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Admin role required.
        "404":
          description: User not found.
        "422":
          description: Invalid role payload.
  /v1/auth/verify-email:
    post:
      tags:
        - Auth
      operationId: verifyEmail
      summary: Verify email address
      description: Consumes a one-time verification token and marks the user's email verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Malformed or invalid verification token.
        "410":
          description: Verification token expired or already used.
        "422":
          description: Invalid verification payload.
  /v1/auth/resend-verification:
    post:
      tags:
        - Auth
      operationId: resendVerification
      summary: Resend verification email
      description: Sends a new verification token when the email belongs to an unverified account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: Generic no-enumeration resend response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "429":
          description: Resend rate limit exceeded.
        "422":
          description: Invalid resend payload.
  /v1/health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check platform readiness
      description: Reports API, database, and Redis readiness for platform health checks.
      responses:
        "200":
          description: API, database, and Redis are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more required platform components are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - display_name
        - roles
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - contributor
              - operator
              - attestor
    RegisterResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    VerifyEmailRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
    ResendVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - bearer
        expires_in:
          type: integer
          example: 900
    CurrentUserResponse:
      type: object
      required:
        - id
        - email
        - display_name
        - roles
        - email_verified
        - kyc_status
        - deactivated_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
        email_verified:
          type: boolean
        kyc_status:
          type: string
        deactivated_at:
          type:
            - string
            - "null"
          format: date-time
    AddRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - contributor
            - operator
            - attestor
    RoleAssignmentResponse:
      type: object
      required:
        - user_id
        - role
        - approved
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
        approved:
          type: boolean
    AdminRoleAssignmentRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - contributor
            - operator
            - attestor
            - admin
    AdminRoleAssignmentResponse:
      type: object
      required:
        - user_id
        - role
        - approved
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
        approved:
          type: boolean
    ComponentHealth:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
        detail:
          type:
            - string
            - "null"
    HealthResponse:
      type: object
      required:
        - status
        - components
      properties:
        status:
          type: string
          enum:
            - ok
            - unhealthy
        components:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentHealth"
