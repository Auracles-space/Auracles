        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Function
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: license_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
