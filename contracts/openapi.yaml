        \ write boundary so an unsafe URL is rejected before storage,\nrather than\
        \ silently nulled on read.\n\nAttributes:\n    headline: Short professional\
        \ headline (<=160 chars).\n    bio: Free-text bio (<=2000 chars).\n    location:\
        \ Free-text location (<=100 chars).\n    website: Personal/site URL; must\
        \ use http or https."
