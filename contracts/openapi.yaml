          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
      - in: query
        name: sort
        required: false
        schema:
          default: newest
          enum:
          - newest
          - top-rated
          - most-purchased
          - price_asc
          - price_desc
          title: Sort
          type: string
      - in: query
        name: sector
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sector
      - in: query
        name: industry
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Industry
      - in: query
        name: function
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Function
      - in: query
        name: category
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - in: query
        name: license_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: License Type
      - in: query
        name: complexity
        required: false
        schema:
          anyOf:
          - maximum: 5
            minimum: 1
            type: integer
          - type: 'null'
          title: Complexity
      - in: query
        name: org_size
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Org Size
      - in: query
        name: lifecycle_stage
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Lifecycle Stage
      - in: query
        name: jurisdiction
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Jurisdiction
      - in: query
        name: price_min
        required: false
        schema:
          anyOf:
          - minimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Price Min
      - in: query
        name: price_max
        required: false
