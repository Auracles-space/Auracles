      type: object
    RubricScoreResponse:
      description: One persisted attestation rubric-score row.
      properties:
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        dimension_id:
          format: uuid
          title: Dimension Id
          type: string
        score:
          anyOf:
          - type: integer
          - type: 'null'
          title: Score
      required:
      - dimension_id
      - score
      - comment
      title: RubricScoreResponse
      type: object
    RubricScoreUpsertRequest:
      description: Draft score and comment for one rubric dimension.
      properties:
        comment:
          anyOf:
          - maxLength: 5000
            type: string
          - type: 'null'
          title: Comment
        score:
          anyOf:
          - maximum: 5.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Score
      title: RubricScoreUpsertRequest
      type: object
    RubricScoresResponse:
      description: All saved rubric scores for one attestation workspace.
      properties:
        scores:
          items:
            $ref: '#/components/schemas/RubricScoreItem'
          title: Scores
          type: array
      required:
      - scores
      title: RubricScoresResponse
      type: object
    SavedSearchCreateRequest:
      description: Operator request body for creating a saved Explore search.
      properties:
        alert_enabled:
          default: false
          title: Alert Enabled
          type: boolean
        filters:
          $ref: '#/components/schemas/ExploreSearchFilters'
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: SavedSearchCreateRequest
      type: object
    SavedSearchListResponse:
      description: List response for Operator-owned saved searches.
      properties:
        saved_searches:
          items:
            $ref: '#/components/schemas/SavedSearchResponse'
          title: Saved Searches
          type: array
      required:
      - saved_searches
      title: SavedSearchListResponse
      type: object
    SavedSearchResponse:
      description: Operator-facing saved-search response.
      properties:
        alert_enabled:
          title: Alert Enabled
          type: boolean
        created_at:
          format: date-time
          title: Created At
          type: string
        filter_version:
          title: Filter Version
          type: integer
        filters:
          additionalProperties: true
          title: Filters
          type: object
        id:
          format: uuid
          title: Id
          type: string
        last_alerted_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Alerted At
        last_alerted_framework_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Last Alerted Framework Id
        name:
          title: Name
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - id
      - user_id
      - name
      - filters
      - filter_version
      - alert_enabled
      - last_alerted_at
      - last_alerted_framework_id
      - created_at
      - updated_at
      title: SavedSearchResponse
      type: object
    SavedSearchUpdateRequest:
      description: Operator request body for editing an owned saved search.
      properties:
        alert_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Alert Enabled
        filters:
          anyOf:
          - $ref: '#/components/schemas/ExploreSearchFilters'
          - type: 'null'
        name:
          anyOf:
          - maxLength: 100
            minLength: 1
            type: string
          - type: 'null'
          title: Name
      title: SavedSearchUpdateRequest
      type: object
    SessionResponse:
      description: Public metadata for one active refresh-token session.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        current:
          title: Current
          type: boolean
        id:
          title: Id
          type: string
        ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip
        last_seen:
          format: date-time
          title: Last Seen
          type: string
        user_agent:
          anyOf:
          - type: string
          - type: 'null'
          title: User Agent
      required:
      - id
      - ip
      - user_agent
      - last_seen
      - created_at
      - current
      title: SessionResponse
      type: object
    SessionsResponse:
      description: Response body for active browser sessions.
      properties:
        sessions:
          items:
            $ref: '#/components/schemas/SessionResponse'
          title: Sessions
          type: array
      required:
      - sessions
      title: SessionsResponse
      type: object
    SimilarityNotice:
      description: Non-blocking internal similarity notice for a processed Artifact.
      properties:
        average_review_score:
          anyOf:
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d{0,2}0*$
            type: string
          - type: 'null'
          title: Average Review Score
        jaccard:
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d{0,4}0*$
          title: Jaccard
          type: string
        nearest_match_artifact_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Nearest Match Artifact Id
        nearest_match_framework_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Nearest Match Framework Id
        nearest_match_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Nearest Match Title
        review_count:
          default: 0
          title: Review Count
          type: integer
      required:
      - jaccard
      title: SimilarityNotice
      type: object
    SimilarityNoticeAcknowledgementRequest:
      description: Request body for acknowledging a non-blocking similarity notice.
      properties:
        differentiation_note:
          maxLength: 1000
          minLength: 5
          title: Differentiation Note
          type: string
      required:
      - differentiation_note
      title: SimilarityNoticeAcknowledgementRequest
      type: object
    SocialLink:
      description: "A single typed social profile link.\n\nAttributes:\n    platform:\
        \ One of the allow-listed social platforms.\n    url: Destination URL on that\
        \ platform; must use http or https."
      properties:
        platform:
          enum:
          - x
          - linkedin
          - github
          - youtube
          - instagram
          - facebook
          - tiktok
          title: Platform
          type: string
        url:
          maxLength: 2048
          minLength: 1
          title: Url
          type: string
      required:
      - platform
      - url
      title: SocialLink
      type: object
    SourcePreviewResponse:
      description: Owner-only, draft-only source preview response for a bound artifact.
      properties:
        preview_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Preview Url
        source_last_synced_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Source Last Synced At
        source_updated:
          title: Source Updated
          type: boolean
      required:
      - preview_url
      - source_updated
      - source_last_synced_at
      title: SourcePreviewResponse
      type: object
    TotpBackupCodesResponse:
      description: One-time response carrying a freshly generated set of backup codes.
      properties:
        backup_codes:
          items:
            type: string
          title: Backup Codes
          type: array
      required:
      - backup_codes
      title: TotpBackupCodesResponse
      type: object
    TotpCodeRequest:
      description: Request body containing a current TOTP code.
      properties:
        code:
          maxLength: 16
          minLength: 6
          title: Code
          type: string
      required:
      - code
      title: TotpCodeRequest
      type: object
    TotpLoginVerifyRequest:
      description: Request body for completing a 2FA login challenge.
      properties:
        challenge_token:
          minLength: 1
          title: Challenge Token
          type: string
        code:
          maxLength: 16
          minLength: 6
          title: Code
          type: string
      required:
      - challenge_token
      - code
      title: TotpLoginVerifyRequest
      type: object
    TotpSetupResponse:
      description: One-time TOTP enrollment response with recovery material.
      properties:
        backup_codes:
          items:
            type: string
          title: Backup Codes
          type: array
        provisioning_uri:
          title: Provisioning Uri
          type: string
        qr_png_base64:
          title: Qr Png Base64
          type: string
      required:
      - provisioning_uri
      - qr_png_base64
      - backup_codes
      title: TotpSetupResponse
      type: object
    TotpStatusResponse:
      description: 'Response body describing TOTP account state.


        ``backup_codes_remaining`` is only meaningful on the status endpoint; the

        enable/disable endpoints leave it at the default since the count is not

        relevant to their result.'
      properties:
        backup_codes_remaining:
          default: 0
          title: Backup Codes Remaining
          type: integer
        totp_enabled:
          title: Totp Enabled
          type: boolean
      required:
      - totp_enabled
      title: TotpStatusResponse
      type: object
    TrialAnswerKeyItem:
      description: One answer-key row joined to its rubric dimension, for the admin
        editor.
      properties:
        dimension_id:
          format: uuid
          title: Dimension Id
          type: string
        expected_score:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expected Score
        label:
          title: Label
          type: string
        tolerance:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tolerance
      required:
      - dimension_id
      - label
      - expected_score
      - tolerance
      title: TrialAnswerKeyItem
      type: object
    TrialAnswerKeysResponse:
      description: Every rubric dimension for a fixture with its answer-key value,
        if set.
      properties:
        review_type:
          title: Review Type
          type: string
        rows:
          items:
            $ref: '#/components/schemas/TrialAnswerKeyItem'
          title: Rows
          type: array
      required:
      - review_type
      - rows
      title: TrialAnswerKeysResponse
      type: object
    TrialArtifactSchema:
      description: A calibration-fixture artifact with a short-lived presigned URL.
      properties:
        mime_type:
          title: Mime Type
          type: string
        name:
          title: Name
          type: string
        url:
          title: Url
          type: string
      required:
      - name
      - mime_type
      - url
      title: TrialArtifactSchema
      type: object
    TrialDecideRequest:
      description: Admin confirmation or override of a trial outcome.
      properties:
        feedback:
          anyOf:
          - maxLength: 5000
            type: string
          - type: 'null'
          title: Feedback
        result:
          enum:
          - pass
          - fail
          title: Result
          type: string
      required:
      - result
      title: TrialDecideRequest
      type: object
    TrialRubricDimensionSchema:
      description: One rubric dimension the nominee must score for a trial.
      properties:
        dimension_id:
          format: uuid
          title: Dimension Id
          type: string
        display_order:
          title: Display Order
          type: integer
        key:
          title: Key
          type: string
        label:
          title: Label
          type: string
      required:
      - dimension_id
      - key
      - label
      - display_order
      title: TrialRubricDimensionSchema
      type: object
    TrialScoreInput:
      description: One nominee score submission for a trial dimension.
      properties:
        comment:
          anyOf:
          - maxLength: 5000
            type: string
          - type: 'null'
          title: Comment
        dimension_id:
          format: uuid
          title: Dimension Id
          type: string
        score:
          maximum: 5.0
          minimum: 1.0
          title: Score
          type: integer
      required:
      - dimension_id
      - score
      title: TrialScoreInput
      type: object
    TrialSubmitRequest:
      description: Full nominee rubric submission for one trial.
      properties:
        scores:
          items:
            $ref: '#/components/schemas/TrialScoreInput'
          minItems: 1
          title: Scores
          type: array
      required:
      - scores
      title: TrialSubmitRequest
      type: object
    UpsertTrialAnswerKeyRequest:
      description: Admin body to create or update one fixture answer-key row.
      properties:
        dimension_id:
          format: uuid
          title: Dimension Id
          type: string
        expected_score:
          maximum: 5.0
          minimum: 1.0
          title: Expected Score
          type: integer
        tolerance:
          maximum: 4.0
          minimum: 0.0
          title: Tolerance
          type: integer
      required:
      - dimension_id
      - expected_score
      - tolerance
      title: UpsertTrialAnswerKeyRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VerifyEmailRequest:
      description: Request body for email verification.
      properties:
        token:
          minLength: 1
          title: Token
          type: string
      required:
      - token
      title: VerifyEmailRequest
      type: object
    WaitlistJoinRequest:
      description: Request body for joining the pre-launch waitlist.
      properties:
        email:
          format: email
          title: Email
          type: string
        source:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: Optional origin hint for the signup (e.g. 'hero', 'footer').
          title: Source
      required:
      - email
      title: WaitlistJoinRequest
      type: object
    WaitlistJoinResponse:
      description: 'Result of a waitlist join attempt.


        `already_joined` is True when the email was previously recorded, letting the

        client confirm the spot without leaking whether the address is new.'
      properties:
        already_joined:
          title: Already Joined
          type: boolean
        message:
          title: Message
          type: string
      required:
      - already_joined
      - message
      title: WaitlistJoinResponse
      type: object
    WebhookIngestResponse:
      description: Small acknowledgement returned to payment providers.
      properties:
        received:
          title: Received
          type: boolean
        status:
          enum:
          - processed
          - received
          - duplicate
          title: Status
          type: string
      required:
      - received
      - status
      title: WebhookIngestResponse
      type: object
    WorkspaceMessageCreateRequest:
      description: Request body for posting a user workspace message.
      properties:
        body:
          anyOf:
          - maxLength: 10000
            minLength: 1
            type: string
          - type: 'null'
          title: Body
        file_keys:
          anyOf:
          - items:
              type: string
            maxItems: 20
            minItems: 1
            type: array
          - type: 'null'
          title: File Keys
      title: WorkspaceMessageCreateRequest
      type: object
    WorkspaceMessageResponse:
      description: Workspace message response returned to Project members.
      properties:
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        created_at:
          format: date-time
          title: Created At
          type: string
        file_keys:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: File Keys
        id:
          format: uuid
          title: Id
          type: string
        project_id:
          format: uuid
          title: Project Id
          type: string
        scan_status:
          title: Scan Status
          type: string
        sender_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Sender Id
        sender_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Sender Name
        system_event:
          anyOf:
          - type: string
          - type: 'null'
          title: System Event
        system_payload:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: System Payload
      required:
      - id
      - project_id
      - sender_id
      - body
      - file_keys
      - scan_status
      - system_event
      - system_payload
      - created_at
      title: WorkspaceMessageResponse
      type: object
    WorkspaceMessagesResponse:
      description: List response for Project workspace messages.
      properties:
        messages:
          items:
            $ref: '#/components/schemas/WorkspaceMessageResponse'
          title: Messages
          type: array
      required:
      - messages
      title: WorkspaceMessagesResponse
      type: object
    WorkspaceUploadCreateRequest:
      description: Request body for creating a workspace presigned upload session.
      properties:
        content_type:
          maxLength: 255
          minLength: 1
          title: Content Type
          type: string
        file_name:
          maxLength: 255
          minLength: 1
          title: File Name
          type: string
        size_bytes:
          exclusiveMinimum: 0.0
          maximum: 26214400.0
          title: Size Bytes
          type: integer
      required:
      - file_name
      - content_type
      - size_bytes
      title: WorkspaceUploadCreateRequest
      type: object
    WorkspaceUploadSessionResponse:
      description: Presigned POST response for a single workspace file upload.
      properties:
        expires_at:
          format: date-time
          title: Expires At
          type: string
        fields:
          additionalProperties:
            type: string
          title: Fields
          type: object
        id:
          format: uuid
          title: Id
          type: string
        s3_key:
          title: S3 Key
          type: string
        size_limit:
          title: Size Limit
          type: integer
        url:
          title: Url
          type: string
      required:
      - id
      - s3_key
      - url
      - fields
      - expires_at
      - size_limit
      title: WorkspaceUploadSessionResponse
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  description: API for the Auracles knowledge marketplace.
  title: Auracles API
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/admin/analytics/dashboard:
    get:
      description: Return current-state admin analytics aggregates plus frozen daily
        trend rows from snapshot history.
      operationId: get_admin_analytics_dashboard_v1_admin_analytics_dashboard_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsDashboardResponse'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Get admin dashboard analytics
      tags:
      - Admin
  /v1/admin/analytics/export:
    get:
      description: Stream frozen snapshot history plus current live totals as one
        flat CSV for bounded admin-selected UTC dates.
      operationId: export_admin_analytics_v1_admin_analytics_export_get
      parameters:
      - in: query
        name: from
        required: true
        schema:
          format: date
          title: From
          type: string
      - in: query
        name: to
        required: true
        schema:
          format: date
          title: To
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
            text/csv:
              schema:
                format: binary
                type: string
          description: CSV export stream
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Export admin analytics as CSV
      tags:
      - Admin
  /v1/admin/attestation-disputes/{dispute_id}/resolve:
    post:
      description: Resolve an Attestation dispute through a 2FA-gated admin action.
      operationId: resolve_attestation_dispute_v1_admin_attestation_disputes__dispute_id__resolve_post
      parameters:
      - in: path
        name: dispute_id
        required: true
        schema:
          format: uuid
          title: Dispute Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAttestationDisputeResolveRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationDisputeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Resolve Attestation Dispute
      tags:
      - Attestation
  /v1/admin/attestations:
    get:
      description: List Attestations in a given status for admin action. Defaults
        to the needs_admin queue — requests auto-matching could not staff, which an
        admin must assign or refund. Admin only.
      operationId: list_admin_attestations_v1_admin_attestations_get
      parameters:
      - in: query
        name: status
        required: false
        schema:
          default: needs_admin
          title: Status
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List attestations for admin triage
      tags:
      - Attestation
  /v1/admin/attestations/{attestation_id}:
    get:
      description: Return one Attestation plus its offer history — which org each
        offer went to (or was accepted by), offer statuses, and timestamps. Admin
        only.
      operationId: get_admin_attestation_detail_v1_admin_attestations__attestation_id__get
      parameters:
      - in: path
        name: attestation_id
        required: true
        schema:
          format: uuid
          title: Attestation Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAttestationDetailResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Attestation detail for admin oversight
      tags:
      - Attestation
  /v1/admin/attestations/{attestation_id}/assign:
    post:
      description: Manually assign a needs-admin Attestation to an attestor org +
        member.
      operationId: admin_assign_attestation_v1_admin_attestations__attestation_id__assign_post
      parameters:
      - in: path
        name: attestation_id
        required: true
        schema:
          format: uuid
          title: Attestation Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAttestationAssignRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationRequestResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Admin Assign Attestation
      tags:
      - Attestation
  /v1/admin/attestations/{attestation_id}/refund:
    post:
      description: Refund and close a needs-admin Attestation.
      operationId: admin_refund_attestation_v1_admin_attestations__attestation_id__refund_post
      parameters:
      - in: path
        name: attestation_id
        required: true
        schema:
          format: uuid
          title: Attestation Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAttestationRefundRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationRequestResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Admin Refund Attestation
      tags:
      - Attestation
  /v1/admin/audit-logs:
    get:
      description: 'Return audit entries, newest first, filterable by action, target
        type, and actor. Complements the financial ledger: the ledger answers what
        happened to a payment, this answers who acted.'
      operationId: list_admin_audit_logs_v1_admin_audit_logs_get
      parameters:
      - in: query
        name: action
        required: false
        schema:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          title: Action
      - in: query
        name: target_type
        required: false
        schema:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          title: Target Type
      - in: query
        name: actor_id
