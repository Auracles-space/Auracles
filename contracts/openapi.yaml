components:
  schemas:
    AccountDeletionBlockedReason:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Count
      type: object
      required:
      - code
      - message
      title: AccountDeletionBlockedReason
      description: One reason why GDPR account deletion is currently blocked.
    AccountDeletionRequestBody:
      properties:
        password:
          anyOf:
          - type: string
            format: password
            writeOnly: true
          - type: 'null'
          title: Password
        totp_code:
          anyOf:
          - type: string
            maxLength: 16
            minLength: 6
          - type: 'null'
          title: Totp Code
      type: object
      title: AccountDeletionRequestBody
      description: 'Request body for starting the GDPR account-deletion cooling-off
        flow.


        Password accounts confirm with their password; passwordless (e.g. Google)

        accounts omit it and rely on the deletion grace period as the safety net.

        TOTP still applies when the account has it enabled.'
    AccountDeletionStatusResponse:
      properties:
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        blocked_reasons:
          items:
            $ref: '#/components/schemas/AccountDeletionBlockedReason'
          type: array
          title: Blocked Reasons
        scheduled_for:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Scheduled For
        requested_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Requested At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
      type: object
      required:
      - id
      - status
      - blocked_reasons
      - scheduled_for
      - requested_at
      - completed_at
      title: AccountDeletionStatusResponse
      description: Latest GDPR account-deletion request state for the current user.
    AddRoleRequest:
      properties:
        role:
          type: string
          enum:
          - contributor
          - operator
          - attestor
          title: Role
      type: object
      required:
      - role
      title: AddRoleRequest
      description: Request body for self-adding a non-privileged role.
    AdminAnalyticsDashboardResponse:
      properties:
        gmv:
          $ref: '#/components/schemas/AdminAnalyticsGmvResponse'
        active_users:
          $ref: '#/components/schemas/AdminAnalyticsWindowCounts'
        new_registrations:
          $ref: '#/components/schemas/AdminAnalyticsWindowCounts'
        frameworks_published:
          $ref: '#/components/schemas/AdminAnalyticsPublishedFrameworks'
        attestations_issued:
          $ref: '#/components/schemas/AdminAnalyticsWindowCounts'
        disputes_open:
          $ref: '#/components/schemas/AdminAnalyticsDisputesOpen'
        trend:
          items:
            $ref: '#/components/schemas/AdminAnalyticsTrendPoint'
          type: array
          title: Trend
      type: object
      required:
      - gmv
      - active_users
      - new_registrations
      - frameworks_published
      - attestations_issued
      - disputes_open
      - trend
      title: AdminAnalyticsDashboardResponse
      description: Current-state admin analytics plus frozen historical trend rows.
    AdminAnalyticsDisputesOpen:
      properties:
        total:
          type: integer
          title: Total
        projects:
          type: integer
          title: Projects
        attestations:
          type: integer
          title: Attestations
      type: object
      required:
      - total
      - projects
      - attestations
      title: AdminAnalyticsDisputesOpen
      description: Current open dispute counts split by dispute source.
    AdminAnalyticsGmvBreakdown:
      properties:
        framework_purchase:
          type: string
          title: Framework Purchase
        collection_purchase:
          type: string
          title: Collection Purchase
        project_milestone:
          type: string
          title: Project Milestone
        attestation_fee:
          type: string
          title: Attestation Fee
      type: object
      required:
      - framework_purchase
      - collection_purchase
      - project_milestone
      - attestation_fee
      title: AdminAnalyticsGmvBreakdown
      description: Money totals for each marketplace revenue source within one window.
    AdminAnalyticsGmvResponse:
      properties:
        today_total:
          type: string
          title: Today Total
        last_7_days_total:
          type: string
          title: Last 7 Days Total
        last_30_days_total:
          type: string
          title: Last 30 Days Total
        today_by_source:
          $ref: '#/components/schemas/AdminAnalyticsGmvBreakdown'
        last_7_days_by_source:
          $ref: '#/components/schemas/AdminAnalyticsGmvBreakdown'
        last_30_days_by_source:
          $ref: '#/components/schemas/AdminAnalyticsGmvBreakdown'
      type: object
      required:
      - today_total
      - last_7_days_total
      - last_30_days_total
      - today_by_source
      - last_7_days_by_source
      - last_30_days_by_source
      title: AdminAnalyticsGmvResponse
      description: GMV totals and by-source breakdowns for the admin dashboard.
    AdminAnalyticsPublishedFrameworks:
      properties:
        total:
          type: integer
          title: Total
        last_24_hours:
          type: integer
          title: Last 24 Hours
        last_7_days:
          type: integer
          title: Last 7 Days
        last_30_days:
          type: integer
          title: Last 30 Days
      type: object
      required:
      - total
      - last_24_hours
      - last_7_days
      - last_30_days
      title: AdminAnalyticsPublishedFrameworks
      description: Published Framework totals and recent publication counts.
    AdminAnalyticsTrendPoint:
      properties:
        snapshot_date:
          type: string
          format: date
          title: Snapshot Date
        gmv_total:
          type: string
          title: Gmv Total
        active_users:
          type: integer
          title: Active Users
        new_registrations:
          type: integer
          title: New Registrations
        frameworks_published:
          type: integer
          title: Frameworks Published
        attestations_issued:
          type: integer
          title: Attestations Issued
        disputes_open:
          type: integer
          title: Disputes Open
      type: object
      required:
      - snapshot_date
      - gmv_total
      - active_users
      - new_registrations
      - frameworks_published
      - attestations_issued
      - disputes_open
      title: AdminAnalyticsTrendPoint
      description: One frozen UTC daily analytics row for dashboard trend charts.
    AdminAnalyticsWindowCounts:
      properties:
        last_24_hours:
          type: integer
          title: Last 24 Hours
        last_7_days:
          type: integer
          title: Last 7 Days
        last_30_days:
          type: integer
          title: Last 30 Days
      type: object
      required:
      - last_24_hours
      - last_7_days
      - last_30_days
      title: AdminAnalyticsWindowCounts
      description: Three standard recency windows used across current-state analytics.
