openapi: 3.1.0
info:
  title: Auracles API
  version: 0.1.0
  description: API contract for the Auracles knowledge marketplace.
servers:
  - url: http://localhost:8000
    description: Local FastAPI server
tags:
  - name: Health
    description: Platform readiness endpoints.
  - name: Auth
    description: Registration and identity verification endpoints.
  - name: Admin
    description: Administrative platform endpoints.
  - name: Settings
    description: Authenticated account settings endpoints.
  - name: Frameworks
    description: Contributor Framework draft management endpoints.
  - name: Explore
    description: Public marketplace catalog endpoints.
  - name: Library
    description: Operator library and licensed download endpoints.
paths:
  /v1/auth/register:
    post:
      tags:
        - Auth
      operationId: registerUser
      summary: Register with email and password
      description: Creates a pending user account and sends an email verification token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Generic no-enumeration registration response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "422":
          description: Invalid registration payload.
  /v1/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Login with email and password
      description: Returns a short-lived access token and sets an HttpOnly refresh cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          headers:
            Set-Cookie:
              description: HttpOnly refresh-token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials.
        "403":
          description: Email unverified or account deactivated.
        "429":
          description: Login rate limit exceeded.
        "422":
          description: Invalid login payload.
  /v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      summary: Refresh access token
      description: Rotates the HttpOnly refresh cookie and returns a new access token.
      responses:
        "200":
          description: Refresh succeeded.
          headers:
            Set-Cookie:
              description: Rotated HttpOnly refresh-token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Missing or invalid refresh token.
  /v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Logout current browser session
      description: Revokes the current refresh token and clears its cookie.
      responses:
        "200":
          description: Logout succeeded.
          headers:
            Set-Cookie:
              description: Expired refresh-token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
  /v1/auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: Get authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Account is deactivated.
  /v1/auth/roles:
    post:
      tags:
        - Auth
      operationId: addRole
      summary: Self-add a role
      description: Allows authenticated users to self-add Contributor or Operator roles.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRoleRequest"
      responses:
        "200":
          description: Role assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignmentResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Attestor role requires admin approval.
        "409":
          description: Role already assigned.
        "422":
          description: Invalid role payload.
  /v1/auth/2fa/setup:
    post:
      tags:
        - Auth
      operationId: setupTotp
      summary: Start TOTP setup
      description: Returns a provisioning URI, QR PNG, and one-time backup codes.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: TOTP setup material generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetupResponse"
        "401":
          description: Missing or invalid access token.
        "409":
          description: TOTP is already enabled.
  /v1/auth/2fa/verify:
    post:
      tags:
        - Auth
      operationId: verifyTotp
      summary: Enable TOTP
      description: Verifies the current TOTP code and enables 2FA.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: TOTP enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpStatusResponse"
        "401":
          description: Missing or invalid access token.
        "409":
          description: TOTP setup has not been started.
        "422":
          description: Invalid TOTP code.
        "429":
          description: TOTP verification rate limit exceeded.
  /v1/auth/2fa/disable:
    post:
      tags:
        - Auth
      operationId: disableTotp
      summary: Disable TOTP
      description: Disables 2FA after validating a current code or backup code.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: TOTP disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpStatusResponse"
        "401":
          description: Missing or invalid access token.
        "409":
          description: TOTP is not enabled.
        "422":
          description: Invalid TOTP code.
        "429":
          description: TOTP verification rate limit exceeded.
  /v1/auth/2fa/verify-login:
    post:
      tags:
        - Auth
      operationId: verifyTotpLogin
      summary: Complete TOTP login challenge
      description: Trades a valid 2FA challenge and code for browser session tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpLoginVerifyRequest"
      responses:
        "200":
          description: 2FA login completed.
          headers:
            Set-Cookie:
              description: HttpOnly refresh-token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "410":
          description: Challenge expired or already used.
        "422":
          description: Invalid TOTP or backup code.
        "429":
          description: TOTP verification rate limit exceeded.
  /v1/admin/users/{user_id}/roles:
    patch:
      tags:
        - Admin
      operationId: assignUserRole
      summary: Assign or approve a user role
      description: Admin-only endpoint for assigning roles and approving Attestors.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleAssignmentRequest"
      responses:
        "200":
          description: Role assigned or approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoleAssignmentResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Admin role required.
        "404":
          description: User not found.
        "422":
          description: Invalid role payload.
  /v1/admin/users/{user_id}/kyc:
    patch:
      tags:
        - Admin
      operationId: reviewUserKyc
      summary: Review user KYC
      description: Admin-only endpoint for approving or rejecting a user's latest KYC document.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminKycReviewRequest"
      responses:
        "200":
          description: KYC review completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKycReviewResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Admin role required.
        "404":
          description: User or KYC document not found.
        "422":
          description: Invalid review payload.
  /v1/admin/frameworks/{framework_id}/suspend:
    post:
      tags:
        - Admin
      operationId: suspendFramework
      summary: Suspend a published Framework
      description: Admin-only post-publish moderation endpoint that removes a Framework from marketplace discovery.
      security:
        - bearerAuth: []
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminFrameworkSuspendRequest"
      responses:
        "200":
          description: Framework suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFrameworkStatusResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Admin role required.
        "404":
          description: Framework not found.
        "409":
          description: Only published Frameworks can be suspended.
        "422":
          description: Invalid suspend payload.
  /v1/admin/licenses:
    post:
      tags:
        - Admin
      operationId: grantLicense
      summary: Grant a Framework license
      description: Admin-only Phase 2 endpoint for granting an Operator access to the current Framework version.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLicenseGrantRequest"
      responses:
        "201":
          description: License granted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLicenseGrantResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Admin role required.
        "404":
          description: Framework or Operator not found.
        "409":
          description: Operator already has a license for this Framework.
        "422":
          description: Invalid license grant payload.
  /v1/auth/verify-email:
    post:
      tags:
        - Auth
      operationId: verifyEmail
      summary: Verify email address
      description: Consumes a one-time verification token and marks the user's email verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Malformed or invalid verification token.
        "410":
          description: Verification token expired or already used.
        "422":
          description: Invalid verification payload.
  /v1/auth/resend-verification:
    post:
      tags:
        - Auth
      operationId: resendVerification
      summary: Resend verification email
      description: Sends a new verification token when the email belongs to an unverified account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: Generic no-enumeration resend response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "429":
          description: Resend rate limit exceeded.
        "422":
          description: Invalid resend payload.
  /v1/auth/forgot-password:
    post:
      tags:
        - Auth
      operationId: forgotPassword
      summary: Request a password reset
      description: Starts password reset without revealing whether the email exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Generic no-enumeration reset response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "429":
          description: Password reset request rate limit exceeded.
        "422":
          description: Invalid forgot-password payload.
  /v1/auth/reset-password:
    post:
      tags:
        - Auth
      operationId: resetPassword
      summary: Reset password
      description: Consumes a single-use reset token and revokes active sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Malformed password reset token.
        "410":
          description: Password reset token expired or already used.
        "422":
          description: Invalid reset payload or weak password.
        "429":
          description: Password reset rate limit exceeded.
  /v1/frameworks:
    post:
      tags:
        - Frameworks
      operationId: createFramework
      summary: Create a draft Framework
      description: Creates a contributor-owned draft Framework. Requires Contributor role, complete profile, and verified KYC.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrameworkCreate"
      responses:
        "201":
          description: Draft Framework created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Contributor role, completed profile, or verified KYC required.
        "422":
          description: Invalid Framework payload.
    get:
      tags:
        - Frameworks
      operationId: listContributorFrameworks
      summary: List Contributor Frameworks
      description: Returns Frameworks owned by the authenticated Contributor.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Contributor Frameworks returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FrameworkListItem"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Contributor role required.
  /v1/frameworks/{framework_id}:
    get:
      tags:
        - Frameworks
      operationId: getContributorFramework
      summary: Get a Contributor Framework
      description: Returns one Framework owned by the authenticated Contributor.
      security:
        - bearerAuth: []
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Framework returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Contributor role required.
        "404":
          description: Framework not found.
    patch:
      tags:
        - Frameworks
      operationId: updateFramework
      summary: Update a draft Framework
      description: Updates metadata and pricing for an owned draft Framework. Requires Contributor role, complete profile, and verified KYC.
      security:
        - bearerAuth: []
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrameworkUpdate"
      responses:
        "200":
          description: Draft Framework updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Contributor role, completed profile, or verified KYC required.
        "404":
          description: Framework not found.
        "409":
          description: Only draft Frameworks can be modified.
        "422":
          description: Invalid update payload.
    delete:
      tags:
        - Frameworks
      operationId: deleteDraftFramework
      summary: Delete a draft Framework
      description: Deletes an owned draft Framework.
      security:
        - bearerAuth: []
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Draft Framework deleted.
        "401":
          description: Missing or invalid access token.
        "403":
          description: Contributor role required.
        "404":
          description: Framework not found.
        "409":
          description: Only draft Frameworks can be deleted.
  /v1/frameworks/{framework_id}/unpublish:
    post:
      tags:
        - Frameworks
      operationId: unpublishFramework
      summary: Unpublish a Framework
      description: Moves an owned published Framework out of the public catalog while preserving existing license access.
      security:
        - bearerAuth: []
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Framework unpublished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Contributor role, completed profile, or verified KYC required.
        "404":
          description: Framework not found.
        "409":
          description: Only published Frameworks can be unpublished.
  /v1/frameworks/{framework_id}/versions:
    post:
      tags:
        - Frameworks
      operationId: createFrameworkVersion
      summary: Create a new draft Framework version
      description: Snapshots the current published version and starts a new editable draft version with explicit Artifact inheritance choices.
      security:
        - bearerAuth: []
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrameworkVersionCreate"
      responses:
        "200":
          description: New draft Framework version created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Contributor role, completed profile, or verified KYC required.
        "404":
          description: Framework not found.
        "409":
          description: Only published or unpublished Frameworks can be versioned.
        "422":
          description: Invalid version request or Artifact inheritance map.
  /v1/frameworks/{framework_id}/submit:
    post:
      tags:
        - Frameworks
      operationId: submitFramework
      summary: Submit Framework to pipeline gate
      description: Sends an owned draft or failed Framework through pipeline gate evaluation. Requires Contributor role, complete profile, and verified KYC.
      security:
        - bearerAuth: []
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Framework submitted or pipeline status evaluated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Contributor role, completed profile, or verified KYC required.
        "404":
          description: Framework not found.
        "409":
          description: Only draft or failed Frameworks can be submitted.
        "422":
          description: At least one Artifact is required.
  /v1/frameworks/{framework_id}/acknowledge-soft-fail:
    post:
      tags:
        - Frameworks
      operationId: acknowledgeFrameworkSoftFail
      summary: Acknowledge external-rarity soft fail
      description: Records Contributor acknowledgement for external-rarity soft failures without publishing the Framework.
      security:
        - bearerAuth: []
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Soft fail acknowledged and pipeline gate re-evaluated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Contributor role, completed profile, or verified KYC required.
        "404":
          description: Framework not found.
        "409":
          description: Only failed pipeline checks can be acknowledged.
  /v1/frameworks/{framework_id}/publish:
    post:
      tags:
        - Frameworks
      operationId: publishFramework
      summary: Publish a pipeline-passed Framework
      description: Publishes an owned Framework after every pipeline gate has passed and snapshots current Artifacts into version history.
      security:
        - bearerAuth: []
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Framework published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Contributor role, completed profile, or verified KYC required.
        "404":
          description: Framework not found.
        "409":
          description: Framework must pass pipeline checks before publish.
        "422":
          description: At least one Artifact is required.
  /v1/frameworks/{framework_id}/artifacts/upload-url:
    post:
      tags:
        - Frameworks
      operationId: requestArtifactUploadUrl
      summary: Request Artifact upload target
      description: Creates a private S3 presigned POST target and pending Artifact row for an owned draft Framework.
      security:
        - bearerAuth: []
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactUploadUrlRequest"
      responses:
        "200":
          description: Artifact upload target created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactUploadUrlResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Contributor role, completed profile, or verified KYC required.
        "404":
          description: Framework not found.
        "409":
          description: Only draft Frameworks can accept Artifact uploads.
        "413":
          description: Framework artifacts exceed the 500MB total size limit.
        "415":
          description: Unsupported Artifact MIME type.
        "422":
          description: Invalid upload request payload.
  /v1/frameworks/{framework_id}/artifacts/confirm:
    post:
      tags:
        - Frameworks
      operationId: confirmArtifactUpload
      summary: Confirm Artifact upload
      description: Confirms the private S3 object exists and dispatches virus scanning idempotently.
      security:
        - bearerAuth: []
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactConfirmRequest"
      responses:
        "200":
          description: Artifact upload confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Contributor role, completed profile, or verified KYC required.
        "404":
          description: Framework or Artifact not found.
        "409":
          description: Artifact object has not been uploaded or Framework is not draft.
        "422":
          description: Invalid confirmation payload.
  /v1/frameworks/{framework_id}/artifacts:
    get:
      tags:
        - Frameworks
      operationId: listFrameworkArtifacts
      summary: List Framework Artifacts
      description: Returns Artifacts attached to an owned Framework.
      security:
        - bearerAuth: []
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Framework Artifacts returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtifactResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Contributor role required.
        "404":
          description: Framework not found.
  /v1/frameworks/{framework_id}/artifacts/{artifact_id}:
    delete:
      tags:
        - Frameworks
      operationId: deleteDraftArtifact
      summary: Delete draft Artifact
      description: Deletes an Artifact from an owned draft Framework and clears preview selection when needed.
      security:
        - bearerAuth: []
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Draft Artifact deleted.
        "401":
          description: Missing or invalid access token.
        "403":
          description: Contributor role required.
        "404":
          description: Framework or Artifact not found.
        "409":
          description: Only draft Framework Artifacts can be deleted.
  /v1/frameworks/{framework_id}/artifacts/{artifact_id}/download:
    get:
      tags:
        - Library
      operationId: downloadLicensedArtifact
      summary: Download licensed Artifact
      description: Returns a short-lived S3 GET URL after Operator role, verified KYC, active license, and version coverage checks pass.
      security:
        - bearerAuth: []
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Licensed Artifact download URL returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDownloadResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Operator role, verified KYC, active license, or licensed version required.
        "404":
          description: Artifact not found.
  /v1/frameworks/{framework_id}/artifacts/{artifact_id}/resolve-pii-review:
    post:
      tags:
        - Frameworks
      operationId: resolveArtifactPiiReview
      summary: Resolve Artifact PII review
      description: Re-runs scanning and processing after a Contributor replaces a PII-flagged Artifact object.
      security:
        - bearerAuth: []
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Artifact reset and processing restarted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Contributor role, completed profile, or verified KYC required.
        "404":
          description: Framework or Artifact not found.
        "409":
          description: Only draft or failed Frameworks can resolve PII review.
  /v1/frameworks/{framework_id}/preview-artifact:
    patch:
      tags:
        - Frameworks
      operationId: setPreviewArtifact
      summary: Set preview Artifact
      description: Designates one Artifact as the preview for an owned draft Framework.
      security:
        - bearerAuth: []
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewArtifactRequest"
      responses:
        "200":
          description: Preview Artifact selected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Contributor role, completed profile, or verified KYC required.
        "404":
          description: Framework or Artifact not found.
        "409":
          description: Only draft Frameworks can change preview Artifact.
        "422":
          description: Invalid preview payload.
  /v1/explore/frameworks:
    get:
      tags:
        - Explore
      operationId: listExploreFrameworks
      summary: List public Framework catalog
      description: Returns published Frameworks with search, filters, pagination, and temporary sort shims.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: q
          in: query
          schema:
            type:
              - string
              - "null"
            minLength: 1
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/ExploreSort"
        - name: sector
          in: query
          schema:
            type:
              - string
              - "null"
        - name: industry
          in: query
          schema:
            type:
              - string
              - "null"
        - name: function
          in: query
          schema:
            type:
              - string
              - "null"
        - name: category
          in: query
          schema:
            type:
              - string
              - "null"
        - name: license_type
          in: query
          schema:
            type:
              - string
              - "null"
        - name: complexity
          in: query
          schema:
            type:
              - integer
              - "null"
            minimum: 1
            maximum: 5
        - name: org_size
          in: query
          schema:
            type:
              - string
              - "null"
        - name: lifecycle_stage
          in: query
          schema:
            type:
              - string
              - "null"
        - name: jurisdiction
          in: query
          schema:
            type:
              - string
              - "null"
        - name: price_min
          in: query
          schema:
            type:
              - string
              - "null"
            pattern: ^[0-9]+(\.[0-9]{1,2})?$
        - name: price_max
          in: query
          schema:
            type:
              - string
              - "null"
            pattern: ^[0-9]+(\.[0-9]{1,2})?$
      responses:
        "200":
          description: Public Framework catalog returned.
          headers:
            X-Sort-Shim:
              description: true when top-rated or most-purchased sort uses newest fallback until Phase 3 data exists.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreFrameworkListResponse"
        "422":
          description: Invalid filter or pagination parameters.
  /v1/explore/frameworks/{framework_id}:
    get:
      tags:
        - Explore
      operationId: getExploreFrameworkDetail
      summary: Get public Framework detail
      description: Returns public detail for a published Framework, including a short-lived preview URL only for the designated preview Artifact.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public Framework detail returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreFrameworkDetail"
        "404":
          description: Published Framework not found.
        "429":
          description: Preview URL rate limit exceeded.
  /v1/explore/frameworks/{framework_id}/related:
    get:
      tags:
        - Explore
      operationId: getRelatedExploreFrameworks
      summary: Get related public Frameworks
      description: Returns up to six published Frameworks related by tag, category, sector, and industry overlap.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Related Frameworks returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExploreFrameworkCard"
        "404":
          description: Published Framework not found.
  /v1/library:
    get:
      tags:
        - Library
      operationId: listOperatorLibrary
      summary: List Operator library
      description: Returns Framework licenses held by the authenticated Operator.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Operator library returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Operator role required.
  /v1/settings/kyc/upload-url:
    post:
      tags:
        - Settings
      operationId: requestKycUploadUrl
      summary: Request KYC upload target
      description: Creates a private S3 presigned POST target for a KYC document.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycUploadUrlRequest"
      responses:
        "200":
          description: Presigned POST upload target created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycUploadUrlResponse"
        "401":
          description: Missing or invalid access token.
        "413":
          description: KYC document exceeds max size.
        "415":
          description: Unsupported KYC document MIME type.
        "422":
          description: Invalid upload request payload.
  /v1/settings/kyc/submit:
    post:
      tags:
        - Settings
      operationId: submitKycUpload
      summary: Submit KYC document
      description: Confirms the uploaded object exists and submits it for review.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycSubmitRequest"
      responses:
        "200":
          description: KYC document submitted for review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatusResponse"
        "401":
          description: Missing or invalid access token.
        "404":
          description: KYC document not found.
        "409":
          description: KYC object has not been uploaded.
        "422":
          description: Invalid submit payload.
  /v1/settings/kyc:
    get:
      tags:
        - Settings
      operationId: getKycStatus
      summary: Get KYC status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user's KYC status and documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatusResponse"
        "401":
          description: Missing or invalid access token.
  /v1/settings/sessions:
    get:
      tags:
        - Settings
      operationId: listSessions
      summary: List active sessions
      description: Returns active refresh-token sessions for the authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active sessions returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponse"
        "401":
          description: Missing or invalid access token.
    delete:
      tags:
        - Settings
      operationId: revokeOtherSessions
      summary: Revoke other sessions
      description: Revokes every refresh-token session except the current browser session.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Other sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "401":
          description: Missing or invalid access token.
  /v1/settings/sessions/{session_id}:
    delete:
      tags:
        - Settings
      operationId: revokeSession
      summary: Revoke a session
      description: Revokes one refresh-token session owned by the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "401":
          description: Missing or invalid access token.
        "404":
          description: Session not found.
  /v1/settings/account/email-change:
    post:
      tags:
        - Settings
      operationId: requestEmailChange
      summary: Request account email change
      description: Sends a verification token to a new email after 2FA confirmation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeRequest"
      responses:
        "200":
          description: Email-change verification sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "401":
          description: Missing or invalid access token.
        "403":
          description: 2FA confirmation is required.
        "409":
          description: Email is already in use.
        "422":
          description: Invalid 2FA code or payload.
  /v1/settings/account/email-change/confirm:
    post:
      tags:
        - Settings
      operationId: confirmEmailChange
      summary: Confirm account email change
      description: Confirms the new email address and revokes active sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeConfirmRequest"
      responses:
        "200":
          description: Email changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Malformed email-change token.
        "409":
          description: Email is already in use.
        "410":
          description: Email-change token expired or already used.
        "422":
          description: Invalid confirmation payload.
  /v1/settings/account/deactivate:
    post:
      tags:
        - Settings
      operationId: deactivateAccount
      summary: Deactivate account
      description: Deactivates the current account and revokes active sessions.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeactivateRequest"
      responses:
        "200":
          description: Account deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "401":
          description: Missing access token or incorrect password.
        "403":
          description: 2FA confirmation is required.
        "422":
          description: Invalid 2FA code or payload.
  /v1/health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check platform readiness
      description: Reports API, database, and Redis readiness for platform health checks.
      responses:
        "200":
          description: API, database, and Redis are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more required platform components are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - display_name
        - roles
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - contributor
              - operator
              - attestor
    RegisterResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    VerifyEmailRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
    ResendVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    LoginResponse:
      type: object
      required:
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        requires_2fa:
          type: boolean
        challenge_token:
          type: string
        token_type:
          type: string
          enum:
            - bearer
        expires_in:
          type: integer
          example: 900
    CurrentUserResponse:
      type: object
      required:
        - id
        - email
        - display_name
        - roles
        - email_verified
        - kyc_status
        - deactivated_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
        email_verified:
          type: boolean
        kyc_status:
          type: string
        deactivated_at:
          type:
            - string
            - "null"
          format: date-time
    AddRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - contributor
            - operator
            - attestor
    RoleAssignmentResponse:
      type: object
      required:
        - user_id
        - role
        - approved
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
        approved:
          type: boolean
    TotpSetupResponse:
      type: object
      required:
        - provisioning_uri
        - qr_png_base64
        - backup_codes
      properties:
        provisioning_uri:
          type: string
        qr_png_base64:
          type: string
          contentEncoding: base64
        backup_codes:
          type: array
          items:
            type: string
          minItems: 10
          maxItems: 10
    TotpCodeRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 16
    TotpStatusResponse:
      type: object
      required:
        - totp_enabled
      properties:
        totp_enabled:
          type: boolean
    TotpLoginVerifyRequest:
      type: object
      required:
        - challenge_token
        - code
      properties:
        challenge_token:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 6
          maxLength: 16
    AdminRoleAssignmentRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - contributor
            - operator
            - attestor
            - admin
    AdminRoleAssignmentResponse:
      type: object
      required:
        - user_id
        - role
        - approved
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
        approved:
          type: boolean
    AdminKycReviewRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - verified
            - rejected
        notes:
          type:
            - string
            - "null"
    AdminKycReviewResponse:
      type: object
      required:
        - user_id
        - kyc_status
        - document_status
      properties:
        user_id:
          type: string
          format: uuid
        kyc_status:
          type: string
        document_status:
          type: string
    AdminFrameworkSuspendRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
    AdminFrameworkStatusResponse:
      type: object
      required:
        - framework_id
        - status
      properties:
        framework_id:
          type: string
          format: uuid
        status:
          type: string
        reason:
          type:
            - string
            - "null"
    AdminLicenseGrantRequest:
      type: object
      required:
        - framework_id
        - operator_id
        - type
      properties:
        framework_id:
          type: string
          format: uuid
        operator_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - single_user
            - team
            - enterprise
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        seats_total:
          type:
            - integer
            - "null"
          minimum: 1
    AdminLicenseGrantResponse:
      type: object
      required:
        - license_id
        - framework_id
        - operator_id
        - type
        - status
        - version_at_grant
        - seats_used
        - seats_total
        - expires_at
      properties:
        license_id:
          type: string
          format: uuid
        framework_id:
          type: string
          format: uuid
        operator_id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
        version_at_grant:
          type: string
        seats_used:
          type: integer
        seats_total:
          type:
            - integer
            - "null"
        expires_at:
          type:
            - string
            - "null"
          format: date-time
    KycUploadUrlRequest:
      type: object
      required:
        - doc_type
        - mime_type
        - file_size
      properties:
        doc_type:
          type: string
          enum:
            - passport
            - drivers_license
            - national_id
            - proof_of_address
        mime_type:
          type: string
        file_size:
          type: integer
          minimum: 1
    KycUploadUrlResponse:
      type: object
      required:
        - upload_url
        - fields
        - s3_key
        - max_size
        - expires_in
      properties:
        upload_url:
          type: string
          description: S3 endpoint URL for the multipart/form-data POST upload.
        fields:
          type: object
          description: Form fields that must be included with the uploaded file.
          additionalProperties:
            type: string
        s3_key:
          type: string
        max_size:
          type: integer
        expires_in:
          type: integer
    KycSubmitRequest:
      type: object
      required:
        - s3_key
      properties:
        s3_key:
          type: string
          minLength: 1
    KycDocumentResponse:
      type: object
      required:
        - id
        - doc_type
        - s3_key
        - mime_type
        - file_size
        - status
        - reviewed_at
        - notes
        - created_at
      properties:
        id:
          type: string
          format: uuid
        doc_type:
          type: string
        s3_key:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
        status:
          type: string
        reviewed_at:
          type:
            - string
            - "null"
          format: date-time
        notes:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
    KycStatusResponse:
      type: object
      required:
        - kyc_status
        - documents
      properties:
        kyc_status:
          type: string
        documents:
          type: array
          items:
            $ref: "#/components/schemas/KycDocumentResponse"
    SessionResponse:
      type: object
      required:
        - id
        - ip
        - user_agent
        - last_seen
        - created_at
        - current
      properties:
        id:
          type: string
        ip:
          type:
            - string
            - "null"
        user_agent:
          type:
            - string
            - "null"
        last_seen:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        current:
          type: boolean
    SessionsResponse:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionResponse"
    EmailChangeRequest:
      type: object
      required:
        - new_email
      properties:
        new_email:
          type: string
          format: email
        totp_code:
          type:
            - string
            - "null"
          minLength: 6
          maxLength: 16
    EmailChangeConfirmRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
    AccountDeactivateRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        totp_code:
          type:
            - string
            - "null"
          minLength: 6
          maxLength: 16
    PricingConfig:
      type: object
      required:
        - price
        - license_types
      properties:
        price:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: USD
        license_types:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - single_user
              - team
              - enterprise
        commercial_rights:
          type:
            - string
            - "null"
        usage_restrictions:
          type:
            - string
            - "null"
    ExploreSort:
      type: string
      enum:
        - newest
        - top-rated
        - most-purchased
        - price_asc
        - price_desc
      default: newest
    ExploreFrameworkCard:
      type: object
      required:
        - id
        - title
        - description
        - version
        - category
        - sector
        - industry
        - function
        - tags
        - jurisdiction
        - complexity
